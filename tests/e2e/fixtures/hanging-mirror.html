<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Han.css — hanging punctuation, close-bracket mirror</title>
<link rel="stylesheet" href="/dist/han.css">
<script type="module" src="/dist/han.auto.js"></script>
<style>
  body { margin: 2rem; font-family: serif }
  /* wide enough that 」，sits mid-line, where the pair squeeze matters. */
  .col { width: 20em; line-height: 2; font-size: 18px }
</style>
</head>
<body>
<p id="target" class="col">甲说「乙丙」，丁戊己庚辛壬癸子丑寅卯辰巳。</p>
</body>
