<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Han.css — hanging punctuation, justified</title>
<link rel="stylesheet" href="/dist/han.css">
<script type="module" src="/dist/han.auto.js"></script>
<style>
  body { margin: 2rem; font-family: serif }
  /* justify is the case that tells a ½em spacer apart from a −½em margin:
     the justifier measures the line's content, and a margin doesn't sit in
     that measurement the way a space does. */
  .col { width: 14em; line-height: 2; font-size: 18px; text-align: justify }
</style>
</head>
<body>
<p id="target" class="col">这是一段测试文字，『说』这个词本身就太慢了。</p>
</body>
</html>
