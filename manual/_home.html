<!doctype html>
<html lang="{{ htmlLang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ siteTitle }}</title>
<meta name="description" content="{{ description }}">
<link rel="icon" href="/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ siteTitle }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:image" content="https://hanzi.pro/img/typeset.png">
<meta property="og:url" content="https://hanzi.pro{{ homeUrl }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ siteTitle }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="https://hanzi.pro/img/typeset.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/webfonts-shanggu-sans@latest/swap.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/webfonts-shanggu-sans-tc@latest/swap.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/webfonts-shanggu-serif@latest/swap.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/webfonts-shanggu-serif-tc@latest/swap.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/diantenjeom@latest/dist/diantenjeom.css">
<link rel="stylesheet" href="/han/han.css">
<link rel="stylesheet" href="/home.css">
<script type="module" src="/han/han.js"></script>
<script type="module" src="/home.js"></script>
</head>
<body class="home" data-locale="{{ locale }}" data-pagefind-ignore="all">
<header class="Topbar">
  <a class="Brand" data-size="lg" href="{{ homeUrl }}">
    <span data-part="mark">漢</span><span data-part="dot">.</span><span data-part="ext">css</span>
    <small>漢字標準格式</small>
  </a>
  <nav>
    <a href="{{ docsUrl }}">{{ docs }}</a>
    <a href="https://github.com/ethantw/Han">GitHub</a>
    {{ langSwitcher }}
    <label class="ThemeToggle">
      <input type="checkbox" name="dark-mode" aria-label="{{ themeToggle }}" title="{{ themeToggle }}">
      <!--
        One job: restore the checkbox's checked state the instant it's
        parsed — before first paint — so `:root:has(input:checked)`
        renders dark on the first frame, no flash. The toggle itself is
        persisted by `theme.js`. Same `localStorage` key ('theme') as
        the docs site's own toggle, so the preference carries over.
        The page's one pre-paint-script exception (web-style.md).
      -->
      <script>
        try {
          const $darkModeInput = document.querySelector('input[name="dark-mode"]')
          const saved = localStorage.getItem('theme')
          $darkModeInput.checked = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        } catch (e) {}
      </script>
      <svg data-name="sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
      <svg data-name="moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </label>
    <span class="VersionTag">肆・〇</span>
  </nav>
</header>

<!-- The playground rail is now a shadow-DOM web component. Its inner
     template (locale-expanded from home/rail.html) is generated into
     home/rail-templates.js and injected into the shadow on connect; the
     page owns only its placement (home.css § han-rail). `form="side"` is
     the initial layout so the grid resolves on first paint; rail-chooser
     .js flips it. `han-rail:not(:defined){visibility:hidden}` (home.css)
     hides it until upgrade — no FOUC. -->
<han-rail lang="{{ locale }}" target="main.han" form="side"></han-rail>

<!-- Rail-form chooser — 選型用，owner 定案後移除。 Floating pill, bottom-right,
     picks between the two rail layouts (writes the `form` attr on
     <han-rail>) and persists the choice in localStorage; boot logic in
     rail-chooser.js. -->
<div class="Chooser" data-rail-chooser>
  <button type="button" data-rail-form="side">側欄</button>
  <button type="button" data-rail-form="top">頂欄</button>
</div>

<main class="han" lang="{{ htmlLang }}">
<fieldset class="DemoLangSwitch" data-demo-lang>
  <legend class="sr-only">{{ dlLegend }}</legend>
  <label><input type="radio" name="demo-lang" value="zh-Hant" checked>{{ dlHant }}</label>
  <label><input type="radio" name="demo-lang" value="zh-Hans">{{ dlHans }}</label>
  <label><input type="radio" name="demo-lang" value="ja">{{ dlJa }}</label>
  <label><input type="radio" name="demo-lang" value="ko">{{ dlKo }}</label>
</fieldset>
{{ manifestoSection }}
{{ stationSemanticsSection }}
{{ stationTypeSection }}
{{ stationLinesSection }}
{{ stationPlaygroundSection }}
{{ stationSnippetSection }}
{{ closingSection }}
</main>
</body>
</html>
