<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ siteTitle }}</title>
<meta name="description" content="{{ description }}">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ siteTitle }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:image" content="https://hanzi.pro/img/typeset.png">
<meta property="og:url" content="https://hanzi.pro{{ homeUrl }}">

<meta name="twitter:description" content="{{ description }}">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/webfonts-shanggu-sans@latest/swap.css" data-han-webfont>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/webfonts-shanggu-serif@latest/swap.css" data-han-webfont>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/diantenjeom@latest/dist/diantenjeom.css" data-han-webfont>
<!-- per-module bundles — the console's module switches toggle link.disabled
     (a stylesheet's *applied* state, not its download: the CSS file is still
     fetched by the preload scanner; disabling only drops it from the cascade). -->
<link rel="stylesheet" href="/han/han.semantics.css" data-han-module="semantics">
<link rel="stylesheet" href="/han/han.lines.css" data-han-module="lines">
<link rel="stylesheet" href="/han/han.prose.css" data-han-module="prose">
<link rel="stylesheet" href="/han/han.fonts.css" data-han-module="fonts">
<link rel="stylesheet" href="/home.css">
<!-- Fonts gate mounted as its OWN module (self-starting singleton),
     and deliberately FIRST: module scripts execute in document order,
     so behind han.js/home.js it would inherit their whole import
     graph's network wait (measured seconds on 3G) — but the gate's
     metronome must wake near the first watermark pass's end (~2.2s
     after first paint) to start the loading encore. One file, no
     imports, dedupe-shared with home.js's import of the same URL. -->
<script type="module" src="/home/fonts-gate.js"></script>
<script type="module" src="/han/han.js"></script>
<script type="module" src="/home.js"></script>

<script>
  // Shared by the pre-paint restore scripts below (theme, console-collapsed):
  // never let a boot-time failure (storage disabled, selector drift) break
  // the rest of the page — but still surface it in devtools instead of
  // swallowing it outright.
  function silentlyTry(fn) {
    try {
      fn()
    } catch (e) {
      console.error('silentlyTry: pre-paint restore failed, page falls back to its default state', e)
    }
  }

  // Fonts-gate pre-paint stamp — copy is color:transparent until the
  // webfont slices land AND the 漢 watermark finishes one full stroke
  // pass (home.css § Fonts gate + home/fonts-gate.js). Stamped here so
  // the first paint is already gated; no-JS never stamps, so the page's
  // settled base (text visible) is untouched. The page's third
  // sanctioned pre-paint script (web-style.md).
  document.documentElement.dataset.fontsGate = 'loading'
</script>
</head>
<body class="home" data-locale="{{ locale }}" data-pagefind-ignore="all">
<header>
  <a class="Logo" href="{{ homeUrl }}">
    {{ logo }}
    <small class="full-name">漢字標準格式</small>
    <small class="version">肆・〇</small>
  </a>
  <nav>
    <a href="{{ docsUrl }}">{{ manual }}</a>
    <a href="https://github.com/hanzipro/han.css">GitHub</a>
    {{ langSwitcher }}
    <label class="Toggle for-theme">
      <input type="checkbox" name="dark-mode" />
      <span title="{{ themeToggle }}">{{ themeToggle }}</span>
      <!--
        One job: restore the checkbox's checked state the instant it's
        parsed — before first paint — so `:root:has(input:checked)`
        renders dark on the first frame, no flash. The toggle itself is
        persisted by `theme.js`. Same `localStorage` key ('theme') as
        the manual site's own toggle, so the preference carries over.
        The page's one pre-paint-script exception (web-style.md).
      -->
      <script>
        silentlyTry(() => {
          const $darkModeInput = document.querySelector('input[name="dark-mode"]')
          const saved = localStorage.getItem('theme')
          $darkModeInput.checked = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        })
      </script>
    </label>
  </nav>
</header>

<!-- The playground console is now a shadow-DOM web component. Its inner
     template (locale-expanded from home/console.html) is generated into
     home/console-templates.js and injected into the shadow on connect; the
     page owns only its placement (home.css § han-console). `form="side"` is
     the layout (the `form` attr stays public component API).
     The `.ConsoleLoading` child is a LIGHT-DOM fallback (home.css § han-console):
     the 字徽 loader shows centered while the component's module + shadow
     sheets load (console is dynamic-imported at gate-open, off the ceremony
     thread — home.js). The instant it upgrades and attaches its shadow
     (no <slot>), the light DOM stops rendering and the toolbar takes over —
     no FOUC, no double loader. -->
<!-- lang 用合法 BCP-47 tag（axe valid-lang 抓過 lang="hant" 違規）；
     元件的 localeOf() 兩種都收（slug 或 tag），zh-Hant → hant。 -->
<han-console lang="{{ htmlLang }}" target="main" form="side">
  <div class="ConsoleLoading" role="status" aria-label="工具欄載入中">
    <svg class="ConsoleLoaderMark" viewBox="0 0 100 100" width="46" height="46" aria-hidden="true">
      <circle class="d1" cx="20" cy="28" r="6.5" />
      <circle class="d2" cx="20" cy="50" r="9.5" />
      <circle class="d3" cx="20" cy="78" r="12.5" />
      <path class="brace-base" d="M 82 14 H 57 V 86 H 82" />
      <polygon class="dun-base" points="58,45 43,50 58,55" />
      <path class="brace-draw" pathLength="100" d="M 82 14 H 57 V 86 H 82" />
      <polygon class="dun" points="58,45 43,50 58,55" />
    </svg>
  </div>
</han-console>

<!-- Collapse handle — page chrome at the aside/content boundary, the only
     way back once the console is collapsed. A real checkbox (same recipe as
     the dark-mode toggle): the LAYOUT is pure CSS via
     `body:has(.ConsoleToggle input:checked)` (home.css); console-collapse.js
     only persists. checked = collapsed. Hidden <52rem and for
     form="top" (home.css § ConsoleToggle). -->
<label class="ConsoleToggle" title="{{ consoleCollapse }}">
  <input type="checkbox" name="console-collapsed" aria-label="{{ consoleCollapse }}">
  <!--
    Restore the collapsed state the instant the checkbox is parsed —
    before first paint — so `body:has(input:checked)` lays out collapsed
    on the first frame, no flash (same no-FOUC pattern as the theme
    checkbox above). The page's other sanctioned pre-paint-script
    exception (web-style.md).
  -->
  <script>
    silentlyTry(() => {
      document.querySelector('input[name="console-collapsed"]').checked =
        localStorage.getItem('han-console-collapsed') === '1'
    })
  </script>
</label>

<main lang="{{ htmlLang }}">
<script>
  // Pre-paint console-config restore — a returning visitor's saved playground
  // config lands on main (and the module/webfont <link> switches) BEFORE
  // first paint, instead of waiting for the console's gate-open dynamic import
  // (home.js). Same localStorage + silentlyTry pattern as the theme /
  // console-collapsed restores. The console, when it upgrades, rehydrates its
  // controls from the SAME key ('han-console-config') and re-applies —
  // idempotent, so no flash. Stored shape is { config, vars }: `vars` is the
  // precomputed cssVars() output, so this script needs no codegen logic;
  // `config` supplies the font-family / metrics / link-switch derivations.
  // The 4th sanctioned pre-paint script (web-style.md) — main is already
  // parsed (this is its first child), the <head> links too. -->
  silentlyTry(() => {
    const raw = localStorage.getItem('han-console-config')
    if (!raw) return
    const { config, vars } = JSON.parse(raw)
    const t = document.querySelector('main')
    if (t && Array.isArray(vars)) {
      for (const [k, v] of vars) t.style.setProperty(k, v)
      if (config.baseGeneric === 'serif') t.style.fontFamily = 'var(--han-font-alternative)'
      const m = config.metrics
      if (m) {
        if (m.size && m.size !== 16) t.style.setProperty('--console-metric-size', `${m.size}px`)
        if (m.leading && m.leading !== 1.75) t.style.setProperty('--console-metric-leading', String(m.leading))
        if (m.weight && m.weight !== 400) t.style.setProperty('--console-metric-weight', String(m.weight))
      }
    }
    // Modules, in the SAME shape as console-config.js § MODULE_MECHANISM —
    // three ride han.css's own flags, only `fonts` unloads its stylesheet.
    // Kept in sync by hand: this script is pre-paint and inline, so it can't
    // import the table. If the two ever disagree the symptom is loud (a
    // module that can't be switched back on until reload), and
    // tests/e2e/module-switches.spec.ts § reload asserts exactly that.
    //
    // `=== false` (not `!value`): a key missing from an older saved schema
    // must default to ON, never silently disable that module.
    const off = (name) => config[name] === false
    const root = document.documentElement
    if (off('semantics')) root.style.setProperty('--han-semantics', 'off')
    if (off('lines')) {
      root.style.setProperty('--han-text-autospace', 'no-autospace')
      root.style.setProperty('--han-punctuation-refinement', 'none')
    }
    for (const name of ['semantics', 'lines', 'prose', 'fonts'])
      if (off(name)) root.dataset[`hanModule${name[0].toUpperCase()}${name.slice(1)}`] = 'off'
    document.querySelectorAll('link[data-han-module="fonts"]').forEach((l) => {
      l.disabled = off('fonts')
    })
    document.querySelectorAll('link[data-han-webfont]').forEach((l) => {
      l.disabled = config.webfontDelivery === 'none'
    })
  })
</script>
