<!doctype html>
<html lang="{{ htmlLang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ notFoundTitle }}・{{ siteTitle }}</title>
<meta name="description" content="{{ description }}">
<!-- The framework, loaded as its FOUR modules — byte-identical to the
     combined `han.css` (verified: the four concatenated normalise to the
     same sheet), split so that (a) the docs share the very same URLs as
     the homepage, which serves them from cache on a home→docs hop, and
     (b) `<han-console>`'s module switches can actually reach them:
     console-config's `applyModules` toggles `link[data-han-module].disabled`,
     a no-op on a page that links only the bundle. -->
<link rel="stylesheet" href="/han/han.semantics.css" data-han-module="semantics">
<link rel="stylesheet" href="/han/han.lines.css" data-han-module="lines">
<link rel="stylesheet" href="/han/han.prose.css" data-han-module="prose">
<link rel="stylesheet" href="/han/han.fonts.css" data-han-module="fonts">
<link rel="stylesheet" href="/manual.css">
<script type="module" src="/han/han.js"></script>
<script>
  // Persist the theme choice; the checkbox itself does the theming.
  document.addEventListener('change', e => {
    if (e.target.name === 'dark-mode') localStorage.setItem('theme', e.target.checked ? 'dark' : 'light')
  })
</script>
</head>
<body class="NotFoundPage" data-locale="{{ locale }}">
<header class="Masthead">
  <a class="Brand" data-size="md" href="{{ homeUrl }}">
    <span data-part="mark">漢</span><span data-part="dot">.</span><span data-part="ext">css</span>
    <span data-part="ver">v{{ version }}</span>
  </a>
  <nav>
    <a href="{{ homeUrl }}">{{ homeLink }}</a>
    <a href="{{ docsUrl }}">{{ docsLink }}</a>
    <!-- Theme toggle. A real checkbox is the single source of truth:
         `:root:has(input[name="dark-mode"]:checked)` (manual.css) flips
         `color-scheme`, and every `light-dark()` token re-resolves. The
         inline script restores the saved choice the instant the input is
         parsed — before first paint, which a deferred script can't do —
         so a dark-saved page never flashes light. manual.js only
         persists changes. Shares the 'theme' key with the homepage. -->
    <label class="Toggle for-theme" title="{{ themeToggle }}">
      <input type="checkbox" name="dark-mode" aria-label="{{ themeToggle }}">
      <script>
        try {
          const $box = document.currentScript.previousElementSibling
          const saved = localStorage.getItem('theme')
          $box.checked = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        } catch (e) {
          console.error('pre-paint theme restore failed; page keeps its default', e)
        }
      </script>
      <span class="Icon" data-name="sun" aria-hidden="true"></span>
      <span class="Icon" data-name="moon" aria-hidden="true"></span>
    </label>
    <a href="https://github.com/ethantw/Han">{{ githubLabel }}</a>
  </nav>
</header>
<main class="NotFound">
  <p data-part="code" aria-hidden="true">404</p>
  <h1>{{ notFoundTitle }}</h1>
  <p>{{ notFoundBody }}</p>
  <p data-part="actions">
    <a href="{{ homeUrl }}" data-action="home">{{ notFoundBackHome }}</a>
    <a href="{{ docsUrl }}" data-action="docs">{{ notFoundBackDocs }}</a>
  </p>
</main>
</body>
</html>
