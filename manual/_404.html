<!doctype html>
<html lang="{{ htmlLang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ notFoundTitle }}・{{ siteTitle }}</title>
<meta name="description" content="{{ description }}">
<script>
  (() => {
    const saved = localStorage.getItem('theme')
    if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved
  })()
</script>
<link rel="stylesheet" href="/han/han.css">
<link rel="stylesheet" href="/manual.css">
<script type="module" src="/han/han.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelector('[data-theme-toggle]')?.addEventListener('click', () => {
      const root = document.documentElement
      const cur = root.dataset.theme
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      const next = cur === 'dark' ? 'light' : 'dark'
      root.dataset.theme = next
      localStorage.setItem('theme', next)
    })
  })
</script>
</head>
<body class="NotFoundPage" data-locale="{{ locale }}">
<header class="Masthead">
  <a class="Brand" data-size="md" href="{{ homeUrl }}">
    <span data-part="mark">漢</span><span data-part="dot">.</span><span data-part="ext">css</span>
    <span data-part="ver">v{{ version }}</span>
  </a>
  <nav>
    <a href="{{ homeUrl }}">{{ homeLink }}</a>
    <a href="{{ docsUrl }}">{{ docsLink }}</a>
    <button type="button" data-theme-toggle aria-label="{{ themeToggle }}" title="{{ themeToggle }}">
      <svg data-name="sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
      <svg data-name="moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <a href="https://github.com/ethantw/Han">{{ githubLabel }}</a>
  </nav>
</header>
<main class="NotFound">
  <p data-part="code" aria-hidden="true">404</p>
  <h1>{{ notFoundTitle }}</h1>
  <p>{{ notFoundBody }}</p>
  <p data-part="actions">
    <a href="{{ homeUrl }}" data-action="home">{{ notFoundBackHome }}</a>
    <a href="{{ docsUrl }}" data-action="docs">{{ notFoundBackDocs }}</a>
  </p>
</main>
</body>
</html>
