<!-- Station III・Line adjustments — squeeze/hang, mixed-script, zhuyin ruby. -->
<section id="station-lines" data-station="lines">
  <hgroup>
    <p>{{ slEyebrow }}</p>
    <h2>{{ slH2 }}</h2>
  </hgroup>

  <p>{{ slLede }}</p>

  <!-- REAL hanging comparison — the SAME kind of sentence, hang off vs on.
       Column A sets `--han-punctuation-refinement: compress` on the <p>
       (an ancestor of the sample text; the JS resolves the mode from the
       element's computed value): squeeze kept, hang OFF, so a line-end
       「，」/「。」 jams in and the margin turns ragged. Column B inherits
       the page config (hang on) on a mint ground: the mark hangs past the
       grid and the block stays square. The measure is tuned so the marks
       really land at a line edge. No fake hang animation. -->
  <figure>
    <blockquote>
      <p>{{ breathingLinesSample }}
    </blockquote>
    <figcaption>
      <p>{{ slP1 }}</p>
      <p>{{ slP2 }}</p>
    </figcaption>
  </figure>

  <!-- 呼吸開關與那條注移出 figcaption，落在站台右半邊的空白裡。左欄本來
       就疊了樣張、兩段說明與一顆控件，資訊過密；右邊除了背後那張放大的
       樣張以外是空的。分欄靠 section 自己的 grid（見 station-lines.css），
       不加包裝用的 div——DOM 仍是「樣張＋旁註」兩件事，不是三層盒子。 -->
  <aside class="Breath">
    <!-- 呼吸開關 — 不是本站自己的開關，是 console 那顆「行的調整」模組
         開關的分身，由 home/module-state.js 雙向綁定（`data-han-module-
         proxy`，站①的語意樣式開關同一套）：這顆按下去按的是 console 的
         按鈕，console 廣播回來再把這顆撥正。所以它跟站外的狀態永遠一致，
         不可能出現「這裡開、那裡關」的自相矛盾。

         擺在 figcaption 裡而不是樣張裡，理由同站①：它一撥就把整頁的
         han.lines.css 帶走，說明文字必須在兩種狀態下都讀得到。撥動的
         報酬也在這裡最大——前景樣張與背後那張放大九倍的樣張同時換氣，
         懸掛的句讀縮回版口內，剩下一條空的懸掛區。 -->
    <label class="Toggle for-lines">
      <input type="checkbox" name="lines" data-han-module-proxy="lines" checked />
      <span>{{ slBreathToggle }}</span>
    </label>
    <!-- 懸掛的閘不只這一個。lines.with-js.css 的
         `--han-state-hanging-punctuation` 是逐文種算的：某個文種選了
         MOE（點居於字身正中）就自己關掉，因為居中的點懸出去只會浮在
         版邊，不貼欄口。ko 沒有對應的居中選項，無從關起。

         值得寫進頁面而不只是註解，是因為本頁的 hant 預設就是 MOE ——
         讀者若照預設看，這一站本來一個字都不會懸。上面兩段樣張各自把
         `--han-punctuation-hant` 撥到 JIS 才有戲看；那是元素上的宣告，
         console 的文種設定蓋不過去，所以這條規則在此地示範不出來，只
         能明說。

         文案裡不用（）括住 MOE：這條注只佔三行，又繼承頁面的兩端對齊，
         而「（」不得居行末——禁則把斷點往前推一格，短掉的那行就被撐開，
         字距肉眼可見地鬆掉。正文才剛說完「字距不因禁則換行而鬆動」，
         注腳自己鬆給人看說不過去。改用破折號帶出，斷點就自由了。 -->
    <small>{{ slMoeNote }}</small>
  </aside>

  <!-- 背後那張放大九倍的樣張。`data-breath` 是視窗閘的 opt-in（home/breath.js）：
       它那口氣動的是變體字重，每幀一記全文件重排，捲出畫面就該停下來。 -->
  <div role="presentation" data-breath>
    <p>{{ breathingLinesSample }}</p>
  </div>
</section>
