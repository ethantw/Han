  <!-- 一封橫跨四百年的通信,寫成一首短詩:〈古騰堡〉問編碼,〈畢昇〉答統一,
       兩人翻遍古籍,終無定論。每一行落一個語意元素、一種標記
       (專名號/著重號/深字重/楷體/書名號甲式/書名號乙式/去偽斜體),
       七行讀完既是對照表,也是一則笑話——這是本站唯一能同時做到兩件事的
       篇幅。刻意不用下方 .Papers 的 KOI-8 故事:同一站講兩遍,第二遍就自動
       降格成裝飾。短句也讓每行剛好一欄,直排帶因此不再自己溢出底緣。

       The conceit, in English: Bi Sheng (膠泥活字, c. 1045, recorded in
       Shen Kuo's 夢溪筆談) and Gutenberg in Mainz argue about code points
       across four centuries — which is what earns the address block its
       reason to exist. Gutenberg needs ~300 sorts for 26 letters and is
       done; Bi Sheng cut thirty thousand — a clean hundredfold — and it
       still isn't enough. And then Unicode turns
       out to hold one table for every script on Earth, most of its million
       code points still empty. Two lifetimes of cutting type, and neither
       man fills a corner of it. He thinks so; he doesn't say so. They
       consult 字驗, the cipher chapter of 武經總要 (前集 卷十五, 1044): forty
       military situations mapped onto the forty characters of a five-word
       poem, a real Song codebook. They reach no conclusion. Fitting reading
       for two men who spent their lives turning language into
       interchangeable units.

       Two rows exist purely to show a mark BREAKING between neighbours,
       which is the part a single specimen can never demonstrate: 專名號 on
       two adjacent proper nouns, and 書名號甲式 on a title and its chapter.
       Note the difference in what the two adjacencies MEAN — adjacent 專名號
       are two separate names, adjacent 書名號 are one work and a part of it.
       Same typographic gap, opposite grammar.

       The poem used to float a `<code>` ghost beside every marked run,
       naming the element. The .MarkDiagram beside it now does that job
       better — the ghosts said «this is called <cite>», the diagram says
       «and this is what it becomes» — so they are gone, tag names and all.

       The console's 語意 module switch hands the whole <article> back to
       browser defaults through `--han-semantics: off` (semantics.css
       § Feature Toggles), so the 「前」state is REAL UA output — synthetic
       obliques and all — never an imitation we drew. That is also why the
       flag lands on the <article> and not the <figure>: a style query reads
       an ANCESTOR, so the caption (and everything outside the poem) has to
       stay out of the subtree it switches. -->

       <address> is the pseudo-italic case at its purest — the UA
       italicises it by default and han.css cancels that for
       :lang(zh|ja|ko) ONLY, so Gutenberg's German twin stays italic,
       exactly as it should. One rule, opposite outcomes.

       The recipient line: 道兄 — a brother on the same Way. The two
       invented movable type INDEPENDENTLY, four centuries apart, so
       any master-and-disciple address (祖師, 先師…) would claim a
       lineage that never existed; 道兄 honours the elder (畢 is the
       senior by ~480 years) while keeping them exactly what the poem
       makes them: peers on one road, each walking it alone. 台啓 is
       the matching opening-formula between respected equals — not
       鈞啓, which bows to a superior. Both are filed
       under postal systems that wouldn't exist for centuries, and both
       postcodes are real: 55116 is Mainz's, and 438712 is 草盤地鎮's,

       with its memorial hall opened in 2023. Gutenberg's letter is
       addressed, quite literally, to the Bi Sheng museum. The Song-era
       address is period-correct too: 蘄州蘄水縣直河鄉 sat in 淮南路
       all of Bi Sheng's life — the 東/西 split only came in 1071,
       twenty years after his death. The postcode rides in the red
       郵遞區號 frame, in kanji numerals — a 直排 column rotates Latin
       digits onto their side, and Chinese numerals are what a vertical
       address would have used anyway. Gutenberg really did print in
       the Hof zum Humbrecht. -->

    <article id="paper-hant" lang="zh-Hant">
      <header>
        <p class="Masthead">太陽中文報</p>
        <p class="Dateline"><time datetime="2126-07-29">中華民國二一五年七月廿九日</time>・科技考古</p>
      </header>
      <h3>謎底竟是一行亂碼</h3>
      <p class="author">【本報月球特派員　<u>錢福興</u>　專電】</p>
      <p><cite>地球無核武協議</cite>簽署已屆十五年，最後一批冷戰飛彈仍未拆除——磁碟完好，讀出來卻是一片漢字天書。<q>一定是磁碟壞了，才會把俄語程序顯示成漢字。</q>十年前的會議紀錄如此寫道；<u>權慧晶</u>教授則主張<u>蘇聯</u>與<u>共產中國</u>的技術交流遠比史書曖昧，漢字或許正是加密手段，為此筆戰十餘年。</p>
      <p>上月，公案以格外令人洩氣的方式收場。破譯組成員<u>循尼亞・薛</u>翻查文獻，讀到一份塵封九十年的備忘錄——頁首印著<u>蘇聯</u><u>標準委員會</u>的紅色徽章，內容是一套名為<dfn>KOI-8</dfn>的字元編碼規範。磁碟從未損毀，那片漢字天書也不是漢字，是一場亂碼。</p>
      <p>所謂<dfn>亂碼</dfn>，是文件以某套對照表寫成——字元各有碼位<var>n</var>——卻被另一套強行解讀：正確的數字，對應到<em>全然錯誤</em>的文字。彼時的電腦，連<i lang="de">Schrödinger</i>都顯示不全。</p>
      <p>人形語言學機器人EISO-2200補充：<q>訓練資料不足以令模型辨識這是編碼錯誤，而非真實的漢字。</q>換言之，<strong>沒有人讀得懂，是因為所有人用的都是錯誤的鑰匙</strong>——正確解讀十七分鐘，而那是一百年前資訊工程系第一週的常識。彈體內的<ruby class="zhuyin">鈽<rt>ㄅㄨˋ</rt></ruby>下週移送民用儲能工廠。有人問那十五年算什麼，<u>循尼亞・薛</u>答：<q>學費。</q></p>
    </article>
    <article id="paper-hans" lang="zh-Hans">
      <header>
        <p class="Masthead">太阳中文报</p>
        <p class="Dateline"><time datetime="2126-07-29">夏历丙戌年六月初十</time>・科技考古</p>
      </header>
      <h3>谜底竟是一行乱码</h3>
      <p class="author">【本报月球特派员　<u>钱福兴</u>　专电】</p>
      <p><cite>地球无核武协议</cite>签署已届十五年，最后一批冷战飞弹仍未拆除——磁碟完好，读出来却是一片汉字天书。<q>一定是磁碟坏了，才会把俄语程序显示成汉字。</q>十年前的会议纪录如此写道；<u>权慧晶</u>教授则主张<u>苏联</u>与<u>共产中国</u>的技术交流远比史书暧昧，汉字或许正是加密手段，为此笔战十余年。</p>
      <p>上月，公案以格外令人泄气的方式收场。破译组成员<u>循尼亚・薛</u>翻查文献，读到一份尘封九十年的备忘录——页首印着<u>苏联</u><u>标准委员会</u>的红色徽章，内容是一套名为<dfn>KOI-8</dfn>的字元编码规范。磁碟从未损毁，那片汉字天书也不是汉字，是一场乱码。</p>
      <p>所谓<dfn>乱码</dfn>，是文件以某套对照表写成——字元各有码位<var>n</var>——却被另一套强行解读：正确的数字，对应到<em>全然错误</em>的文字。彼时的电脑，连<i lang="de">Schrödinger</i>都显示不全。</p>
      <p>人形语言学机器人EISO-2200补充：<q>训练资料不足以令模型辨识这是编码错误，而非真实的汉字。</q>换言之，<strong>没有人读得懂，是因为所有人用的都是错误的钥匙</strong>——正确解读十七分钟，而那是一百年前资讯工程系第一周的常识。弹体内的<ruby>钚<rt>bù</rt></ruby>下周移送民用储能工厂。有人问那十五年算什么，<u>循尼亚・薛</u>答：<q>学费。</q></p>
    </article>
    <article id="paper-ja" lang="ja">
      <header>
        <p class="Masthead">太陽中文報</p>
        <p class="Dateline"><time datetime="2126-07-29">弘宙元年七月二十九日</time>・科技考古</p>
      </header>
      <h3>謎は一行の文字化けだった</h3>
      <p class="author">【本紙月面特派員　<u>錢福興</u>　特電】</p>
      <p><cite>地球非核協定</cite>の調印から十五年、最後の冷戦ミサイルはいまだ解体できずにいる——ディスクは無傷なのに、読み出せるのは漢字の天書ばかり。<q>ディスクが壊れているに決まっている、でなければロシア語のプログラムが漢字で表示されるものか。</q>十年前の会議記録はそう書き残した。一方、<u>權慧晶</u>教授は<u>ソ連</u>と<u>共産中国</u>の技術交流が史書よりはるかに<ruby>曖昧<rt>あいまい</rt></ruby>で、漢字こそ暗号の手立てだったと主張し、十余年の論争を張った。</p>
      <p>先月、その公案は実に気の抜ける形で決着した。解読班の<u><ruby>循尼亞<rt>シューニャ</rt></ruby>・薛</u>が文献を漁るうち、九十年<ruby>眠<rt>ねむ</rt></ruby>り続けた覚書を見つけた——表紙には<u>ソ連</u><u>標準委員会</u>の赤い<ruby>徽章<rt>きしょう</rt></ruby>、中身は<dfn>KOI-8</dfn>と呼ばれる文字符号化規格だった。ディスクは壊れていなかったし、あの漢字の天書も漢字ではなかった。文字化けだったのだ。</p>
      <p><dfn>文字化け</dfn>とは、ある対応表で書かれた文書——文字はそれぞれ符号位置<var>n</var>を持つ——を、別の対応表で強引に読み解いた結果である：正しい数値が、<em>まったく見当違いの文字</em>に対応してしまう。当時のコンピュータは、<i lang="de">Schrödinger</i>という名前さえ完全に表示できなかった。</p>
      <p>ヒューマノイド言語学ロボットEISO-2200は<q>訓練データが不十分なため、モデルはこれが符号化エラーであると認識できないのだ</q>と補った。要するに、<strong>誰にも読めなかったのは、全員が間違った鍵を使っていたからだ</strong>——正確な解読に要した時間は十七分、しかも百年前なら情報工学科の一週目に習う常識だった。弾体内のプルトニウムは、来週民生用蓄電工場へ移送される。あの十五年は何だったのかと問われ、<u><ruby>循尼亞<rt>シューニャ</rt></ruby>・薛</u>は答えた。<q>授業料です。</q></p>
    </article>

      <h3><ruby>謎底<rt>미저</rt></ruby>는 한 줄의 <ruby>亂碼<rt>난마</rt></ruby>였다</h3>
      <p class="author">【<ruby>本紙<rt>본지</rt></ruby> <ruby>月球<rt>월구</rt></ruby> <ruby>特派員<rt>특파원</rt></ruby> <u>전복흥</u> <ruby>專電<rt>전전</rt></ruby>】</p>
      <p><cite><ruby>地球<rt>지구</rt></ruby> <ruby>非核<rt>비핵</rt></ruby> <ruby>協定<rt>협정</rt></ruby></cite> <ruby>締結<rt>체결</rt></ruby> 15年——마지막 <ruby>冷戰<rt>냉전</rt></ruby> 미사일은 아직 <ruby>解體<rt>해체</rt></ruby>되지 않았다。디스크는 <ruby>完好<rt>완호</rt></ruby>하나，읽어내면 <ruby>漢字<rt>한자</rt></ruby> <ruby>天書<rt>천서</rt></ruby>뿐이었다。<q>디스크가 고장 난 게 <ruby>分明<rt>분명</rt></ruby>하다，그러지 않고서야 러시아語 프로그램이 <ruby>漢字<rt>한자</rt></ruby>로 보일 리 없다。</q> 10年 전 <ruby>會議<rt>회의</rt></ruby> <ruby>記錄<rt>기록</rt></ruby>은 그렇게 적었다。한편 <u>권혜정</u> <ruby>敎授<rt>교수</rt></ruby>는 <u><ruby>蘇聯<rt>소련</rt></ruby></u>과 <u><ruby>共産中國<rt>공산중국</rt></ruby></u>의 <ruby>技術<rt>기술</rt></ruby> <ruby>交流<rt>교류</rt></ruby>가 <ruby>史書<rt>사서</rt></ruby>보다 훨씬 <ruby>曖昧<rt>애매</rt></ruby>했고，<ruby>漢字<rt>한자</rt></ruby>가 곧 <ruby>暗號<rt>암호</rt></ruby>의 수단이었다고 <ruby>主張<rt>주장</rt></ruby>하며 10餘年 <ruby>論爭<rt>논쟁</rt></ruby>을 벌였다。</p>
      <p>지난달，그 <ruby>公案<rt>공안</rt></ruby>은 맥 빠지는 방식으로 <ruby>決着<rt>결착</rt></ruby>됐다。<ruby>解讀班<rt>해독반</rt></ruby> <ruby>隊員<rt>대원</rt></ruby> <u>슈냐 설</u>이 <ruby>文獻<rt>문헌</rt></ruby>을 뒤지다 90年 동안 <ruby>塵封<rt>진봉</rt></ruby>된 <ruby>備忘錄<rt>비망록</rt></ruby>을 발견했다——표지에는 <u><ruby>蘇聯<rt>소련</rt></ruby></u> <u><ruby>標準<rt>표준</rt></ruby> <ruby>委員會<rt>위원회</rt></ruby></u>의 붉은 <ruby>徽章<rt>휘장</rt></ruby>이 찍혀 있었고，<ruby>內容<rt>내용</rt></ruby>은 <dfn>KOI-8</dfn>이라는 <ruby>符號化<rt>부호화</rt></ruby> <ruby>規格<rt>규격</rt></ruby>이었다。디스크는 <ruby>損傷<rt>손상</rt></ruby>된 적이 없었고，그 <ruby>漢字<rt>한자</rt></ruby> <ruby>天書<rt>천서</rt></ruby>도 <ruby>漢字<rt>한자</rt></ruby>가 아니었다。<ruby>亂碼<rt>난마</rt></ruby>였던 것이다。</p>
      <p>소위 <dfn><ruby>亂碼<rt>난마</rt></ruby></dfn>란，한 <ruby>對照表<rt>대조표</rt></ruby>로 작성된 <ruby>文書<rt>문서</rt></ruby>——<ruby>文字<rt>문자</rt></ruby>마다 코드 포인트 <var>n</var>이 있다——가 다른 <ruby>對照表<rt>대조표</rt></ruby>로 <ruby>强制<rt>강제</rt></ruby> <ruby>解讀<rt>해독</rt></ruby>될 때 생기는 결과다。올바른 <ruby>數字<rt>수자</rt></ruby>가 <em>완전히 <ruby>誤謬<rt>오류</rt></ruby>의 <ruby>文字<rt>문자</rt></ruby></em>에 <ruby>對應<rt>대응</rt></ruby>되는 것이다。당시의 <ruby>電腦<rt>전뇌</rt></ruby>는 <i lang="de">Schrödinger</i>라는 이름조차 온전히 표시할 수 없었다。</p>
      <p><ruby>人形<rt>인형</rt></ruby> <ruby>言語學<rt>언어학</rt></ruby> 로봇 EISO-2200이 덧붙였다。<q><ruby>訓練<rt>훈련</rt></ruby> <ruby>資料<rt>자료</rt></ruby>가 <ruby>不足<rt>부족</rt></ruby>하여，<ruby>模型<rt>모형</rt></ruby>은 이것이 <ruby>符號化<rt>부호화</rt></ruby> <ruby>誤謬<rt>오류</rt></ruby>임을 <ruby>識別<rt>식별</rt></ruby>하지 못했습니다。</q> 다시 말해，<strong>아무도 읽어낼 수 없었던 것은 모두가 <ruby>誤謬<rt>오류</rt></ruby>의 열쇠를 사용했기 때문이다</strong>——<ruby>正確<rt>정확</rt></ruby>한 <ruby>解讀<rt>해독</rt></ruby>은 17分，그것도 100年 전이라면 <ruby>情報工學科<rt>정보공학과</rt></ruby> 첫 주에 배우는 <ruby>常識<rt>상식</rt></ruby>이었다。<ruby>彈體<rt>탄체</rt></ruby> 속 플루토늄은 다음 주 <ruby>民用<rt>민용</rt></ruby> <ruby>儲能<rt>저능</rt></ruby> <ruby>工場<rt>공장</rt></ruby>으로 <ruby>移送<rt>이송</rt></ruby>된다。그 15年은 무엇이었느냐는 물음에 <u>슈냐 설</u>은 답했다。<q><ruby>授業料<rt>수업료</rt></ruby>입니다。</q></p>
