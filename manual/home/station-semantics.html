  <!-- 一封橫跨四百年的通信,寫成一首短詩:〈古騰堡〉問編碼,〈畢昇〉答統一,
       兩人翻遍古籍,終無定論。每一行落一個語意元素、一種標記
       (專名號/著重號/深字重/楷體/書名號甲式/書名號乙式/去偽斜體),
       七行讀完既是對照表,也是一則笑話——這是本站唯一能同時做到兩件事的
       篇幅。刻意不用下方 .Papers 的 KOI-8 故事:同一站講兩遍,第二遍就自動
       降格成裝飾。短句也讓每行剛好一欄,直排帶因此不再自己溢出底緣。

       The conceit, in English: Bi Sheng (膠泥活字, c. 1045, recorded in
       Shen Kuo's 夢溪筆談) and Gutenberg in Mainz argue about code points
       across four centuries — which is what earns the address block its
       reason to exist. Gutenberg needs ~300 sorts for 26 letters and is
       done; Bi Sheng cut thirty thousand — a clean hundredfold — and it
       still isn't enough. And then Unicode turns
       out to hold one table for every script on Earth, most of its million
       code points still empty. Two lifetimes of cutting type, and neither
       man fills a corner of it. He thinks so; he doesn't say so. They
       consult 字驗, the cipher chapter of 武經總要 (前集 卷十五, 1044): forty
       military situations mapped onto the forty characters of a five-word
       poem, a real Song codebook. They reach no conclusion. Fitting reading
       for two men who spent their lives turning language into
       interchangeable units.

       Two rows exist purely to show a mark BREAKING between neighbours,
       which is the part a single specimen can never demonstrate: 專名號 on
       two adjacent proper nouns, and 書名號甲式 on a title and its chapter.
       Note the difference in what the two adjacencies MEAN — adjacent 專名號
       are two separate names, adjacent 書名號 are one work and a part of it.
       Same typographic gap, opposite grammar.

       The poem used to float a `<code>` ghost beside every marked run,
       naming the element. The .MarkDiagram beside it now does that job
       better — the ghosts said «this is called <cite>», the diagram says
       «and this is what it becomes» — so they are gone, tag names and all.

       The console's 語意 module switch hands the whole <article> back to
       browser defaults through `--han-semantics: off` (semantics.css
       § Feature Toggles), so the 「前」state is REAL UA output — synthetic
       obliques and all — never an imitation we drew. That is also why the
       flag lands on the <article> and not the <figure>: a style query reads
       an ANCESTOR, so the caption (and everything outside the poem) has to
       stay out of the subtree it switches. -->

       <address> is the pseudo-italic case at its purest — the UA
       italicises it by default and han.css cancels that for
       :lang(zh|ja|ko) ONLY, so Gutenberg's German twin stays italic,
       exactly as it should. One rule, opposite outcomes.

       The recipient line: 道兄 — a brother on the same Way. The two
       invented movable type INDEPENDENTLY, four centuries apart, so
       any master-and-disciple address (祖師, 先師…) would claim a
       lineage that never existed; 道兄 honours the elder (畢 is the
       senior by ~480 years) while keeping them exactly what the poem
       makes them: peers on one road, each walking it alone. 台啓 is
       the matching opening-formula between respected equals — not
       鈞啓, which bows to a superior. Both are filed
       under postal systems that wouldn't exist for centuries, and both
       postcodes are real: 55116 is Mainz's, and 438712 is 草盤地鎮's,

       with its memorial hall opened in 2023. Gutenberg's letter is
       addressed, quite literally, to the Bi Sheng museum. The Song-era
       address is period-correct too: 蘄州蘄水縣直河鄉 sat in 淮南路
       all of Bi Sheng's life — the 東/西 split only came in 1071,
       twenty years after his death. The postcode rides in the red
       郵遞區號 frame, in kanji numerals — a 直排 column rotates Latin
       digits onto their side, and Chinese numerals are what a vertical
       address would have used anyway. Gutenberg really did print in
       the Hof zum Humbrecht. -->

            <h3>謎底竟是一行亂碼</h3>
            <p><cite>地球無核武協議</cite>簽署已屆第十五年，人類距離徹底廢除核武的終點，卻仍差著最後幾枚鏽跡斑斑的老物件。</p>
            <p>問題不在政治，不在意願，而在一批沒有人看得懂的磁碟。</p>
            <p>彼時冷戰的遺產——<u>蘇聯</u>一九七〇、八〇年代部署的洲際飛彈群——至今仍帶著原裝的啟動與關閉程序，封存在<u>烏拉爾山</u>以東某處的地下設施裡。程序本身從未損毀，問題在於：沒有任何人能讀懂它們寫了什麼。</p>
            <figure class="ReaderCut">
            <div class="ReaderCutPlate" role="img" aria-label="地下設施裡並列的洲際飛彈"></div>
            <figcaption><u>烏拉爾山</u>以東某處的地下設施，封存的洲際飛彈群。（本報資料照）</figcaption>
          </figure>
            <p>各國政府為此組建了一支史無前例的破譯團隊，成員橫跨科技考古學家、精通多國語言的語言學者，乃至最新一代的人形語言學機器人。十五年來，這支隊伍踏遍地球每一座存有冷戰檔案的地下庫房，始終無功而返。癥結始終是同一個：那些磁碟在現代考古電腦上解讀出來的，是一片漢字與亂符交織的天書。</p>
            <p><q>一定是磁碟壞了，</q>一位不願具名的科技考古學家在十年前的會議紀錄中留下這句話，<q>才會把俄語程序顯示成漢字。</q></p>
            <p>另一派學者則持截然相反的看法，並因此引發一場延燒十餘年的學術筆戰。以<u>權慧晶</u>教授為首的一派指出，<u>蘇聯</u>與<u>共產中國</u>之間的關係，或許遠比史書記載的更為曖昧——彼此在意識形態上雖劍拔弩張，私下的技術交流是否完全斷絕，史料從未給出明確答案。程序中摻入中文，或以漢字作為加密手段，並非全無可能。</p>
            <p>（編按：此論點目前史學界尚無定論，然而中蘇於一九六九年已爆發邊境武裝衝突，<u>蘇聯</u>更一度評估對中國發動核先制攻擊，學界多數意見認為技術共享可能性極低。該爭論至今仍是考古語言學界著名公案。）</p>
            <p>上述爭議，在上月以一種格外令人洩氣的方式畫下句點。</p>
            <p>謎底不在磁碟，不在蘇中秘密協議，而在一件所有人都忘了去想的事：編碼。</p>
            <p>破譯組的年輕成員<u>循尼亞・薛</u>，在一次例行翻查二十世紀資訊工程文獻時，無意間讀到一份塵封九十年的技術備忘錄，頁首印著<u>蘇聯</u><u>標準委員會</u>的紅色徽章，內容涉及一套名為<dfn>KOI-8</dfn>的字元編碼規範——專為西里爾字母設計，與當時西方通行的ASCII系統互不相容，彼此之間無一字母對應。</p>
            <p>在此有必要向習慣了萬碼歸一的現代讀者稍作説明。所謂<dfn>編碼</dfn>，是電腦將文字轉化為數字訊號時所依據的對照表；而所謂<dfn>亂碼</dfn>，是當一份文件用某套對照表寫成，卻被另一套對照表強行解讀時，所產生的荒謬結果——正確的數字，對應到了<em>全然錯誤的文字</em>。這在今日聽來匪夷所思，因為當代通行的Unicode標準已將地球上幾乎所有文字系統收納其中，任何裝置讀取任何文件，皆從同一張總表取字，亂碼作為一種日常災難，早已絕跡逾八十年。然而在二十世紀下半葉，各國、各系統、有時甚至各機構之間，各自維護著一套互不承認的編碼規範，猶如語言相通卻字母各異的平行文明。<q>當時美國的電腦，</q><u>循尼亞・薛</u>在記者會上以平靜得近乎殘忍的語氣説，<q>連<i lang="de">Schrödinger</i>這個名字，當時的電腦都無法完整顯示——那個用來命名核子時代最著名思想實驗的人。整個數位文明在當時其實是各説各話的。</q></p>
            <p>她隨即補充，KOI-8及其同類編碼，在距今約九十年前，已隨著Unicode統一標準的全球普及而悄然退出歷史舞台。近半個世紀以來，人工智慧模型的訓練語料庫中，這類格式的文本已稀少到可以忽略不計。</p>
            <p><q>連電腦也不行，</q>現場待機的人形語言學機器人EISO-2200補充道，措辭一如既往地精確而不帶任何感情色彩，<q>相關訓練資料量不足以令模型辨識這屬於一種系統性的編碼錯誤，而非真實的漢字內容。</q></p>
            <p>換言之：<strong>沒有人讀得懂，是因為所有人用的都是錯誤的鑰匙</strong>。正確的解法，是以KOI-8格式重新讀取磁碟，再轉換為當代Unicode標準。整個過程耗時約十七分鐘。而這個方法，在一百年前本是任何一名資訊工程學生入學第一週便會習得的常識——只是那門課，早已從所有大學的課綱裡消失。</p>
            <p>破譯組事後表示，正確版本的程序以標準俄語寫成，技術邏輯清晰，保存狀態完好，並無任何損毀或加密跡象。</p>
            <p>據悉，拆除作業將於下周正式啟動。這批飛彈內部的<ruby class="zhuyin">鈽<rt>ㄅㄨˋ</rt></ruby>與鈾-235，將統一移送至非洲超導電池聯合工廠，降濃縮處理後製成民用儲能電芯，首批成品預定免費配發予月球定居點及<u>南極洲</u>越冬站居民，作為取暖設備電源。</p>
            <p>一個半世紀前凝固的末日預言，以這樣的方式抵達它最終的去處：某戶人家的暖氣，在極夜裡亮著。</p>
            <p><u>循尼亞・薛</u>離開記者台前，有人在人群中喊了一句：<q>那十五年呢？</q></p>
            <p>她停頓了一秒。</p>
            <p><q>那十五年，</q>她説，<q>是我們為不記得歷史所付的學費。</q></p>
            <p>掌聲沒有響起。</p>
          </div>
        </article>
      </dialog>
    </article>

      <p class="Abstract"><cite>地球无核武协议</cite>签署已届十五年，最后一批冷战飞弹仍未拆除——磁碟完好，读出来却是一片汉字天书。<u>权慧晶</u>教授一度主张那是<u>苏联</u>与<u>共产中国</u>的加密手段；备忘录却指向<dfn>KOI-8</dfn>：正确的数字，对应到<em>全然错误</em>的文字。弹体内的<ruby>钚<rt>bù</rt></ruby>下周移送民用储能工厂。</p>

            <h3>谜底竟是一行乱码</h3>
            <p><cite>地球无核武协议</cite>签署已届第十五年，人类距离彻底废除核武的终点，却仍差着最后几枚锈迹斑斑的老物件。</p>
            <p>问题不在政治，不在意愿，而在一批没有人看得懂的磁碟。</p>
            <p>彼时冷战的遗产——<u>苏联</u>一九七〇、八〇年代部署的洲际飞弹群——至今仍带着原装的启动与关闭程序，封存在<u>乌拉尔山</u>以东某处的地下设施里。程序本身从未损毁，问题在于：没有任何人能读懂它们写了什么。</p>
            <figure class="ReaderCut">
            <div class="ReaderCutPlate" role="img" aria-label="地下设施里并列的洲际飞弹"></div>
            <figcaption><u>乌拉尔山</u>以东某处的地下设施，封存的洲际飞弹群。（本报资料照）</figcaption>
          </figure>
            <p>各国政府为此组建了一支史无前例的破译团队，成员横跨科技考古学家、精通多国语言的语言学者，乃至最新一代的人形语言学机器人。十五年来，这支队伍踏遍地球每一座存有冷战档案的地下库房，始终无功而返。症结始终是同一个：那些磁碟在现代考古电脑上解读出来的，是一片汉字与乱符交织的天书。</p>
            <p><q>一定是磁碟坏了，</q>一位不愿具名的科技考古学家在十年前的会议纪录中留下这句话，<q>才会把俄语程序显示成汉字。</q></p>
            <p>另一派学者则持截然相反的看法，并因此引发一场延烧十余年的学术笔战。以<u>权慧晶</u>教授为首的一派指出，<u>苏联</u>与<u>共产中国</u>之间的关系，或许远比史书记载的更为暧昧——彼此在意识形态上虽剑拔弩张，私下的技术交流是否完全断绝，史料从未给出明确答案。程序中掺入中文，或以汉字作为加密手段，并非全无可能。</p>
            <p>（编按：此论点目前史学界尚无定论，然而中苏于一九六九年已爆发边境武装冲突，<u>苏联</u>更一度评估对中国发动核先制攻击，学界多数意见认为技术共享可能性极低。该争论至今仍是考古语言学界著名公案。）</p>
            <p>上述争议，在上月以一种格外令人泄气的方式画下句点。</p>
            <p>谜底不在磁碟，不在苏中秘密协议，而在一件所有人都忘了去想的事：编码。</p>
            <p>破译组的年轻成员<u>循尼亚・薛</u>，在一次例行翻查二十世纪资讯工程文献时，无意间读到一份尘封九十年的技术备忘录，页首印着<u>苏联</u><u>标准委员会</u>的红色徽章，内容涉及一套名为<dfn>KOI-8</dfn>的字元编码规范——专为西里尔字母设计，与当时西方通行的ASCII系统互不相容，彼此之间无一字母对应。</p>
            <p>在此有必要向习惯了万码归一的现代读者稍作说明。所谓<dfn>编码</dfn>，是电脑将文字转化为数字讯号时所依据的对照表；而所谓<dfn>乱码</dfn>，是当一份文件用某套对照表写成，却被另一套对照表强行解读时，所产生的荒谬结果——正确的数字，对应到了<em>全然错误的文字</em>。这在今日听来匪夷所思，因为当代通行的Unicode标准已将地球上几乎所有文字系统收纳其中，任何装置读取任何文件，皆从同一张总表取字，乱码作为一种日常灾难，早已绝迹逾八十年。然而在二十世纪下半叶，各国、各系统、有时甚至各机构之间，各自维护着一套互不承认的编码规范，犹如语言相通却字母各异的平行文明。<q>当时美国的电脑，</q><u>循尼亚・薛</u>在记者会上以平静得近乎残忍的语气说，<q>连<i lang="de">Schrödinger</i>这个名字，当时的电脑都无法完整显示——那个用来命名核子时代最著名思想实验的人。整个数位文明在当时其实是各说各话的。</q></p>
            <p>她随即补充，KOI-8及其同类编码，在距今约九十年前，已随着Unicode统一标准的全球普及而悄然退出历史舞台。近半个世纪以来，人工智慧模型的训练语料库中，这类格式的文本已稀少到可以忽略不计。</p>
            <p><q>连电脑也不行，</q>现场待机的人形语言学机器人EISO-2200补充道，措辞一如既往地精确而不带任何感情色彩，<q>相关训练资料量不足以令模型辨识这属于一种系统性的编码错误，而非真实的汉字内容。</q></p>
            <p>换言之：<strong>没有人读得懂，是因为所有人用的都是错误的钥匙</strong>。正确的解法，是以KOI-8格式重新读取磁碟，再转换为当代Unicode标准。整个过程耗时约十七分钟。而这个方法，在一百年前本是任何一名资讯工程学生入学第一周便会习得的常识——只是那门课，早已从所有大学的课纲里消失。</p>
            <p>破译组事后表示，正确版本的程序以标准俄语写成，技术逻辑清晰，保存状态完好，并无任何损毁或加密迹象。</p>
            <p>据悉，拆除作业将于下周正式启动。这批飞弹内部的<ruby>钚<rt>bù</rt></ruby>与铀-235，将统一移送至非洲超导电池联合工厂，降浓缩处理后制成民用储能电芯，首批成品预定免费配发予月球定居点及<u>南极洲</u>越冬站居民，作为取暖设备电源。</p>
            <p>一个半世纪前凝固的末日预言，以这样的方式抵达它最终的去处：某户人家的暖气，在极夜里亮着。</p>
            <p><u>循尼亚・薛</u>离开记者台前，有人在人群中喊了一句：<q>那十五年呢？</q></p>
            <p>她停顿了一秒。</p>
            <p><q>那十五年，</q>她说，<q>是我们为不记得历史所付的学费。</q></p>
            <p>掌声没有响起。</p>
          </div>

      <h3>謎は一行の文字化けだった</h3>
      <p class="author">【本紙月面特派員　<u>錢福興</u>　特電】</p>
      <p class="Abstract"><cite>地球非核協定</cite>の調印から十五年、最後の冷戦ミサイルはいまだ解体できずにいる——ディスクは無傷なのに、読み出せるのは漢字の天書ばかり。<u>權慧晶</u>教授は<u>ソ連</u>と<u>共産中国</u>の技術交流が史書よりはるかに<ruby>曖昧<rt>あいまい</rt></ruby>だと主張したが、覚書が指したのは<dfn>KOI-8</dfn>——正しい数値が、<em>まったく見当違いの文字</em>に対応してしまう。</p>

          <div class="ReaderBody">
            <h3>謎は一行の文字化けだった</h3>
            <p><cite>地球非核協定</cite>の調印からちょうど十五年、人類が核兵器の完全廃絶という終着点に辿り着くまで、まだ最後の数発、<ruby>錆<rt>さび</rt></ruby>の浮いた老兵たちが残っている。</p>
            <p>問題は政治でも意志でもなく、誰にも読めない磁気ディスクの一束にある。</p>
            <p>かつての冷戦の<ruby>遺産<rt>いさん</rt></ruby>――<u>ソ連</u>が一九七〇年代から八〇年代にかけて配備した大陸間弾道ミサイル群――は今なお起動・停止手順を<ruby>搭載<rt>とうさい</rt></ruby>したまま、<ruby>ウラル山脈<rt>うらるさんみゃく</rt></ruby>の東のどこか、地下施設の奥に封印されている。手順そのものは損なわれていない。問題はただ一点：それが何を書いているのか、誰にもわからないことだ。</p>
            <figure class="ReaderCut">
            <div class="ReaderCutPlate" role="img" aria-label="地下施設に並ぶ大陸間弾道ミサイル"></div>
            <figcaption><u>ウラル山脈</u>の東、地下施設に封印された大陸間弾道ミサイル群。（本紙資料写真）</figcaption>
          </figure>
            <p>各国政府はそのために<ruby>前例<rt>ぜんれい</rt></ruby>のない解読チームを結成した。技術考古学者、多言語に精通する言語学者、さらには最新世代のヒューマノイド言語学ロボットまで、幅広い顔ぶれが揃った。十五年にわたり、このチームは地球上に存在する冷戦文書の地下保管庫をくまなく踏破したが、常に手ぶらで戻ってきた。<ruby>癥結<rt>ちょうけつ</rt></ruby>はいつも同じだった――現代の考古用コンピュータでディスクを読み出すと、漢字と意味不明な記号が入り混じった<ruby>天書<rt>てんしょ</rt></ruby>が現れるのだ。</p>
            <p><q>ディスクが壊れているに決まっている</q>と、匿名を希望した技術考古学者が十年前の会議記録に書き残している。<q>だからロシア語のプログラムが漢字で表示されるのだ</q></p>
            <p>対照的な見解を持つ別の学派はその言葉に真っ向から<ruby>反駁<rt>はんばく</rt></ruby>し、十余年にわたる学術論争の火蓋を切った。<u>權慧晶</u>教授を筆頭とする一派が指摘するのは、<u>ソ連</u>と<u>共産中国</u>の関係が、歴史書の記述よりはるかに<ruby>曖昧<rt>あいまい</rt></ruby>だった可能性だ――イデオロギー上は<ruby>剣呑<rt>けんのん</rt></ruby>な緊張関係にありながら、水面下での技術交流が完全に断絶していたかどうか、史料は明確な答えを与えていない。プログラムに中国語が<ruby>紛<rt>まじ</rt></ruby>れ込んでいること、あるいは漢字が暗号手段として使われていることは、まったくありえない話ではないというのだ。</p>
            <p>（編注：この論点に関しては史学界でいまだ定説がない。しかし中ソは一九六九年に国境武力衝突を起こしており、<u>ソ連</u>は中国への核先制攻撃を一時検討していたとされる。学界の多数意見は技術共有の可能性を極めて低いと見ており、この論争は考古言語学の著名な未解決問題として今日も残っている。）</p>
            <p>この論争は先月、ひどく<ruby>拍子抜け<rt>ひょうしぬけ</rt></ruby>のする形で幕を閉じた。</p>
            <p>謎はディスクにも中ソ秘密協定にもなく、誰もが考えようとしなかった一点にあった――<ruby>符号化<rt>ふごうか</rt></ruby>、つまり文字エンコーディングの問題だ。</p>
            <p>解読チームの若いメンバー、<u><ruby>循尼亞<rt>シューニャ</rt></ruby>・薛</u>は、ある日の例行的な二十世紀情報工学文献の調査中、九十年間<ruby>眠<rt>ねむ</rt></ruby>り続けた一通の技術覚書を偶然目にした。表紙には<u>ソ連</u><u>標準委員会</u>の赤い<ruby>徽章<rt>きしょう</rt></ruby>が押されており、内容は<dfn>KOI-8</dfn>と呼ばれる文字符号化規格に関するものだった――<ruby>キリル文字<rt>きりるもじ</rt></ruby>専用に設計されたこの規格は、当時の西側で普及していたASCIIシステムと互換性がなく、一文字の対応もない。</p>
            <p>ここで、万コードが一つに統一された現代に慣れた読者のために、少し補足しておく必要がある。<dfn>エンコーディング</dfn>とは、コンピュータが文字を数値信号に変換する際に参照する対応表のことだ。そして<dfn>文字化け</dfn>とは、ある対応表で書かれた文書を、別の対応表で強引に読み解こうとしたとき生じる<ruby>滑稽<rt>こっけい</rt></ruby>な結果である――正しい数値が、<em>まったく見当違いの文字</em>に対応してしまう。現代の感覚ではおよそ<ruby>信<rt>しん</rt></ruby>じがたい話だが、現在広く使われているUnicode規格は地球上のほぼすべての文字体系を収録しており、どの機器でどの文書を開いても同じ一覧表から文字を引くため、日常的な<ruby>惨事<rt>さんじ</rt></ruby>としての文字化けはすでに八十年以上前に<ruby>絶滅<rt>ぜつめつ</rt></ruby>している。しかし二十世紀後半には、国ごと、システムごと、時には機関ごとに、互いを認めない符号化規格が乱立していた。言語は通じるのにアルファベットが異なる並行文明のようなものだ。<q>当時のアメリカのコンピュータでは</q>と<u><ruby>循尼亞<rt>シューニャ</rt></ruby>・薛</u>は記者会見で、穏やかでほとんど残酷なほどの口調で語った。<q><i lang="de">Schrödinger</i>という名前さえ完全に表示できなかった――核の時代の最も有名な思考実験に名を冠した、あの人物の名前が。デジタル文明全体が、当時は互いに別の言葉を喋っていたのだ</q></p>
            <p>さらに彼女は付け加えた。KOI-8およびそれと同種の符号化規格は、今から約九十年前、Unicode統一標準が世界に普及するとともに、静かに歴史の舞台を降りた。この半世紀近く、人工知能モデルの訓練コーパスにおいて、こうした形式のテキストはほぼ無視できるほど希少になっている。</p>
            <p><q>コンピュータでも無理だった</q>と、その場に待機していたヒューマノイド言語学ロボットEISO-2200が、いつものように正確で感情を帯びない言葉で補った。<q>関連する訓練データが不十分なため、モデルはこれが系統的な符号化エラーであると認識できず、実際の漢字コンテンツだと判断してしまうのだ</q></p>
            <p>要するに、<strong>誰にも読めなかったのは、全員が間違った鍵を使っていたからだ</strong>。正しい解法は、KOI-8形式でディスクを再度読み込み、現代のUnicode規格に変換すること。全工程の所要時間は約十七分。そしてその方法は、百年前であれば情報工学を学ぶ学生なら入学第一週に習う常識だった――ただ、その授業が、あらゆる大学のカリキュラムから消えてずいぶん経つ。</p>
            <p>解読チームはその後、正しいバージョンのプログラムは標準的なロシア語で書かれており、技術的な論理は明快で保存状態も完全、損傷も暗号化の<ruby>痕跡<rt>こんせき</rt></ruby>もまったくなかったと発表した。</p>
            <p>伝えられるところによれば、解体作業は来週にも正式に開始される。これらのミサイルに搭載されたプルトニウムおよびウラン235は、アフリカの超伝導電池統合工廠に送られ、<ruby>減濃縮<rt>げんのうしゅく</rt></ruby>処理ののち民生用蓄電セルへと製造される。初回の製品は月面定住地および南極越冬基地の居住者に無償配布される予定で、暖房設備の電源として使われる。</p>
            <p>一世紀半前に<ruby>凝固<rt>ぎょうこ</rt></ruby>した終末の予言は、こうして最終的な行き先に辿り着く。どこかの家の暖房として、極夜の中で灯り続ける。</p>
            <p><u><ruby>循尼亞<rt>シューニャ</rt></ruby>・薛</u>が記者台を離れようとしたとき、人群の中から声が飛んだ。<q>じゃあ、その十五年は？</q></p>
            <p>彼女は一秒、間を置いた。</p>
            <p><q>あの十五年は</q>と彼女は言った、<q>歴史を忘れた代償として、我々が払った授業料だ</q></p>
            <p>拍手は起きなかった。</p>
          </div>
        </article>

            <h3><ruby>謎底<rt>미저</rt></ruby>는 한 줄의 <ruby>亂碼<rt>난마</rt></ruby>였다</h3>
            <p><cite><ruby>地球<rt>지구</rt></ruby> <ruby>非核<rt>비핵</rt></ruby> <ruby>協定<rt>협정</rt></ruby></cite> <ruby>締結<rt>체결</rt></ruby> <ruby>十五週年<rt>십오주년</rt></ruby>이 되었건만、<ruby>人類<rt>인류</rt></ruby>가 <ruby>核兵器<rt>핵무기</rt></ruby> <ruby>完全<rt>완전</rt></ruby> <ruby>廢絕<rt>폐절</rt></ruby>의 <ruby>終點<rt>종점</rt></ruby>에 이르기까지는 아직도 마지막 몇 기의 녹슨 <ruby>老物件<rt>노물건</rt></ruby>이 남아 있다。</p>
            <p><ruby>問題<rt>문제</rt></ruby>는 <ruby>政治<rt>정치</rt></ruby>에도、<ruby>意志<rt>의지</rt></ruby>에도 있지 않다。아무도 읽어낼 수 없는 <ruby>磁氣<rt>자기</rt></ruby> 디스크 한 묶음에 있다。</p>
            <p><ruby>冷戰<rt>냉전</rt></ruby>의 <ruby>遺産<rt>유산</rt></ruby>——<u><ruby>蘇聯<rt>소련</rt></ruby></u>이 <ruby>一九七〇<rt>일구칠공</rt></ruby>·<ruby>八〇年代<rt>팔공년대</rt></ruby>에 <ruby>配備<rt>배비</rt></ruby>한 <ruby>大陸間<rt>대륙간</rt></ruby> <ruby>彈道<rt>탄도</rt></ruby> <ruby>飛彈群<rt>비탄군</rt></ruby>——은 오늘까지도 <ruby>原裝<rt>원장</rt></ruby> <ruby>起動<rt>기동</rt></ruby>·<ruby>停止<rt>정지</rt></ruby> <ruby>程序<rt>정서</rt></ruby>를 그대로 간직한 채、<ruby>烏拉爾山<rt>우랄산</rt></ruby> <ruby>以東<rt>이동</rt></ruby> 어딘가의 <ruby>地下<rt>지하</rt></ruby> <ruby>施設<rt>시설</rt></ruby>에 <ruby>封存<rt>봉존</rt></ruby>되어 있다。<ruby>程序<rt>정서</rt></ruby> <ruby>自體<rt>자체</rt></ruby>는 한 번도 <ruby>損傷<rt>손상</rt></ruby>되지 않았다。<ruby>問題<rt>문제</rt></ruby>는 단 하나——그것이 무엇을 적고 있는지 읽어낼 수 있는 사람이 없다는 것이다。</p>
            <figure class="ReaderCut">
            <div class="ReaderCutPlate" role="img" aria-label="地下 施設에 늘어선 大陸間 彈道 飛彈"></div>
            <figcaption><u>烏拉爾山</u> 以東 어딘가의 地下 施設에 封存된 大陸間 彈道 飛彈群。（본지 자료사진）</figcaption>
          </figure>
            <p>각국 <ruby>政府<rt>정부</rt></ruby>는 이를 위해 <ruby>史上<rt>사상</rt></ruby> <ruby>前例<rt>전례</rt></ruby>가 없는 <ruby>解讀<rt>해독</rt></ruby> <ruby>特別隊<rt>특별대</rt></ruby>를 <ruby>編成<rt>편성</rt></ruby>했다。<ruby>構成員<rt>구성원</rt></ruby>은 <ruby>科學<rt>과학</rt></ruby> <ruby>考古學者<rt>고고학자</rt></ruby>、여러 나라 말에 정통한 <ruby>言語學者<rt>언어학자</rt></ruby>、그리고 <ruby>最新<rt>최신</rt></ruby> <ruby>世代<rt>세대</rt></ruby>의 <ruby>人形<rt>인형</rt></ruby> <ruby>言語學<rt>언어학</rt></ruby> <ruby>機器人<rt>기기인</rt></ruby>에 이르기까지 두루 걸쳐 있었다。<ruby>十五年<rt>십오년</rt></ruby> 동안 이 <ruby>隊伍<rt>대오</rt></ruby>는 <ruby>地球<rt>지구</rt></ruby> 위에 <ruby>冷戰<rt>냉전</rt></ruby> <ruby>文書<rt>문서</rt></ruby>가 보관된 <ruby>地下<rt>지하</rt></ruby> <ruby>庫房<rt>고방</rt></ruby>을 모조리 뒤졌으나、끝내 빈손이었다。<ruby>癥結<rt>증결</rt></ruby>은 언제나 같았다。<ruby>現代<rt>현대</rt></ruby> <ruby>考古<rt>고고</rt></ruby> <ruby>電腦<rt>전뇌</rt></ruby>로 읽어낸 그 <ruby>磁氣<rt>자기</rt></ruby> 디스크들은 한자와 <ruby>亂符<rt>난부</rt></ruby>가 뒤엉킨 한 장의 <ruby>天書<rt>천서</rt></ruby>였다。</p>
            <p><q>틀림없이 <ruby>磁氣<rt>자기</rt></ruby> 디스크가 망가진 것이다.</q> <ruby>匿名<rt>익명</rt></ruby>을 원한 한 <ruby>科學<rt>과학</rt></ruby> <ruby>考古學者<rt>고고학자</rt></ruby>가 <ruby>十年<rt>십년</rt></ruby> 전 <ruby>會議<rt>회의</rt></ruby> <ruby>記錄<rt>기록</rt></ruby>에 남긴 말이다。<q>러시아어 <ruby>程序<rt>정서</rt></ruby>가 한자로 표시되는 건 그 때문이다.</q></p>
            <p>또 다른 <ruby>一派<rt>일파</rt></ruby>의 <ruby>學者<rt>학자</rt></ruby>들은 <ruby>正反對<rt>정반대</rt></ruby>의 견해를 <ruby>固執<rt>고집</rt></ruby>하며、그로 인해 <ruby>十餘年<rt>십여년</rt></ruby>에 걸친 <ruby>學術<rt>학술</rt></ruby> <ruby>筆戰<rt>필전</rt></ruby>이 <ruby>勃發<rt>발발</rt></ruby>했다。그들은 <u><ruby>蘇聯<rt>소련</rt></ruby></u>과 <u><ruby>共産<rt>공산</rt></ruby> <ruby>中國<rt>중국</rt></ruby></u> 사이의 <ruby>關係<rt>관계</rt></ruby>가 <ruby>史書<rt>사서</rt></ruby>에 기록된 것보다 훨씬 더 <ruby>曖昧<rt>애매</rt></ruby>했을지 모른다고、<u>권혜정</u> <ruby>敎授<rt>교수</rt></ruby>를 <ruby>筆頭<rt>필두</rt></ruby>로 한 一派가 <ruby>指摘<rt>지적</rt></ruby>한다——<ruby>相互間<rt>상호간</rt></ruby>에 <ruby>意識形態<rt>의식형태</rt></ruby>적으로는 <ruby>劍拔弩張<rt>검발노장</rt></ruby>이었어도、비밀스러운 <ruby>技術<rt>기술</rt></ruby> <ruby>交流<rt>교류</rt></ruby>가 완전히 <ruby>斷絕<rt>단절</rt></ruby>되었는지는 <ruby>史料<rt>사료</rt></ruby>가 <ruby>明確<rt>명확</rt></ruby>한 <ruby>答<rt>답</rt></ruby>을 준 적이 없다는 것이다。<ruby>程序<rt>정서</rt></ruby> 안에 중국어가 뒤섞이거나 한자가 <ruby>暗號化<rt>암호화</rt></ruby> <ruby>手段<rt>수단</rt></ruby>으로 쓰였을 <ruby>可能性<rt>가능성</rt></ruby>도 <ruby>全無<rt>전무</rt></ruby>하다고는 할 수 없다는 것이다。</p>
            <p>（<ruby>編按<rt>편안</rt></ruby>：이 <ruby>論點<rt>논점</rt></ruby>에 대해 <ruby>史學界<rt>사학계</rt></ruby>는 아직 <ruby>定論<rt>정론</rt></ruby>을 내리지 못했다。그러나 <ruby>中蘇<rt>중소</rt></ruby>는 <ruby>一九六九年<rt>일구육구년</rt></ruby>에 이미 <ruby>國境<rt>국경</rt></ruby> <ruby>武裝<rt>무장</rt></ruby> <ruby>衝突<rt>충돌</rt></ruby>을 <ruby>勃發<rt>발발</rt></ruby>시켰고、<u><ruby>蘇聯<rt>소련</rt></ruby></u>은 한때 <ruby>中國<rt>중국</rt></ruby>에 대한 <ruby>核先制攻擊<rt>핵선제공격</rt></ruby>을 <ruby>評價<rt>평가</rt></ruby>한 바 있으며、<ruby>學界<rt>학계</rt></ruby> <ruby>多數<rt>다수</rt></ruby>는 <ruby>技術<rt>기술</rt></ruby> <ruby>共有<rt>공유</rt></ruby> <ruby>可能性<rt>가능성</rt></ruby>이 극히 낮다고 본다。이 <ruby>論爭<rt>논쟁</rt></ruby>은 오늘날까지도 <ruby>考古<rt>고고</rt></ruby> <ruby>言語學界<rt>언어학계</rt></ruby>의 著名한 <ruby>公案<rt>공안</rt></ruby>으로 남아 있다.）</p>
            <p>위의 <ruby>爭議<rt>쟁의</rt></ruby>는 지난달 유독 <ruby>洩氣<rt>설기</rt></ruby>스러운 방식으로 <ruby>終止符<rt>종지부</rt></ruby>를 찍었다。</p>
            <p><ruby>謎底<rt>미저</rt></ruby>는 <ruby>磁氣<rt>자기</rt></ruby> 디스크에도、<ruby>蘇中<rt>소중</rt></ruby> <ruby>秘密<rt>비밀</rt></ruby> <ruby>協定<rt>협정</rt></ruby>에도 있지 않았다。모두가 생각하기를 잊어버린 한 가지——<ruby>符號化<rt>부호화</rt></ruby>——에 있었다。</p>
            <p><ruby>解讀<rt>해독</rt></ruby> <ruby>班<rt>반</rt></ruby>의 젊은 <ruby>隊員<rt>대원</rt></ruby> <u>슈냐 설</u>은、어느 <ruby>平常<rt>평상</rt></ruby>한 날 <ruby>二十世紀<rt>이십세기</rt></ruby> <ruby>情報工學<rt>정보공학</rt></ruby> <ruby>文獻<rt>문헌</rt></ruby>을 <ruby>定例<rt>정례</rt></ruby>로 <ruby>閱覽<rt>열람</rt></ruby>하던 중、<ruby>九十年<rt>구십년</rt></ruby> 동안 <ruby>塵封<rt>진봉</rt></ruby>되어 있던 <ruby>技術<rt>기술</rt></ruby> <ruby>備忘錄<rt>비망록</rt></ruby> 한 장을 우연히 발견했다。<ruby>頁首<rt>혈수</rt></ruby>에는 <u><ruby>蘇聯<rt>소련</rt></ruby></u> <u><ruby>標準<rt>표준</rt></ruby> <ruby>委員會<rt>위원회</rt></ruby></u>의 붉은 <ruby>徽章<rt>휘장</rt></ruby>이 찍혀 있었고、<ruby>內容<rt>내용</rt></ruby>은 <dfn>KOI-8</dfn>이라는 이름의 <ruby>字元<rt>자원</rt></ruby> <ruby>符號化<rt>부호화</rt></ruby> <ruby>規格<rt>규격</rt></ruby>에 관한 것이었다——키릴 <ruby>文字<rt>문자</rt></ruby>를 위해 <ruby>設計<rt>설계</rt></ruby>된 것으로、당시 <ruby>西方<rt>서방</rt></ruby>에서 통용되던 ASCII <ruby>體系<rt>체계</rt></ruby>와 서로 <ruby>相容<rt>상용</rt></ruby>되지 않아、어느 <ruby>文字<rt>문자</rt></ruby> 하나도 <ruby>對應<rt>대응</rt></ruby>하는 것이 없었다。</p>
            <p>여기서 <ruby>萬碼歸一<rt>만마귀일</rt></ruby>에 익숙해진 <ruby>現代<rt>현대</rt></ruby> <ruby>讀者<rt>독자</rt></ruby>에게 잠시 <ruby>説明<rt>설명</rt></ruby>이 <ruby>必要<rt>필요</rt></ruby>하다。소위 <dfn><ruby>符號化<rt>부호화</rt></ruby></dfn>란 <ruby>電腦<rt>전뇌</rt></ruby>가 <ruby>文字<rt>문자</rt></ruby>를 <ruby>數字<rt>수자</rt></ruby> <ruby>信號<rt>신호</rt></ruby>로 <ruby>變換<rt>변환</rt></ruby>할 때 <ruby>依據<rt>의거</rt></ruby>하는 <ruby>對照表<rt>대조표</rt></ruby>이다。그리고 소위 <dfn><ruby>亂碼<rt>난마</rt></ruby></dfn>란、어떤 <ruby>文書<rt>문서</rt></ruby>가 한 <ruby>對照表<rt>대조표</rt></ruby>로 작성되었는데 다른 <ruby>對照表<rt>대조표</rt></ruby>로 <ruby>强制<rt>강제</rt></ruby> <ruby>解讀<rt>해독</rt></ruby>될 때 생겨나는 <ruby>荒唐<rt>황당</rt></ruby>한 결과다——올바른 <ruby>數字<rt>수자</rt></ruby>가 <em>완전히 <ruby>誤謬<rt>오류</rt></ruby>의 <ruby>文字<rt>문자</rt></ruby></em>에 <ruby>對應<rt>대응</rt></ruby>되는 것이다。오늘날에는 이 말이 황당하게 들릴 것이다。왜냐하면 <ruby>當代<rt>당대</rt></ruby>에 통용되는 Unicode <ruby>標準<rt>표준</rt></ruby>은 <ruby>地球<rt>지구</rt></ruby> 위의 거의 모든 <ruby>文字<rt>문자</rt></ruby> <ruby>體系<rt>체계</rt></ruby>를 <ruby>網羅<rt>망라</rt></ruby>하여、어떤 <ruby>裝置<rt>장치</rt></ruby>에서 어떤 <ruby>文書<rt>문서</rt></ruby>를 열어도 같은 하나의 <ruby>總表<rt>총표</rt></ruby>에서 <ruby>文字<rt>문자</rt></ruby>를 가져오기 때문이다。<ruby>亂碼<rt>난마</rt></ruby>는 하나의 <ruby>日常的<rt>일상적</rt></ruby> <ruby>災難<rt>재난</rt></ruby>으로서 이미 <ruby>八十年<rt>팔십년</rt></ruby> 이상 전에 <ruby>絶跡<rt>절적</rt></ruby>했다。그러나 <ruby>二十世紀<rt>이십세기</rt></ruby> <ruby>下半葉<rt>하반엽</rt></ruby>에는、각국·각 <ruby>體系<rt>체계</rt></ruby>·때로는 심지어 각 <ruby>機關<rt>기관</rt></ruby>마다 서로 <ruby>承認<rt>승인</rt></ruby>하지 않는 <ruby>符號化<rt>부호화</rt></ruby> <ruby>規格<rt>규격</rt></ruby>을 각자 <ruby>維持<rt>유지</rt></ruby>하고 있었다。마치 <ruby>言語<rt>언어</rt></ruby>는 같지만 <ruby>文字<rt>문자</rt></ruby>가 서로 다른 <ruby>平行<rt>평행</rt></ruby> <ruby>文明<rt>문명</rt></ruby>과도 같았다。<q>당시 <ruby>美國<rt>미국</rt></ruby>의 <ruby>電腦<rt>전뇌</rt></ruby>는、</q> <u>슈냐 설</u>이 <ruby>記者<rt>기자</rt></ruby> <ruby>會見<rt>회견</rt></ruby>에서 <ruby>冷靜<rt>냉정</rt></ruby>함이 거의 <ruby>殘忍<rt>잔인</rt></ruby>함에 가까운 <ruby>語調<rt>어조</rt></ruby>로 말했다。<q><i lang="de">Schrödinger</i>라는 이름조차、당시의 <ruby>電腦<rt>전뇌</rt></ruby>는 <ruby>完整<rt>완전</rt></ruby>하게 표시할 수 없었습니다——<ruby>核子<rt>핵자</rt></ruby> <ruby>時代<rt>시대</rt></ruby>의 가장 著名한 <ruby>思想實驗<rt>사상실험</rt></ruby>에 이름을 남긴 그 사람의 이름을。<ruby>全體<rt>전체</rt></ruby> <ruby>數位<rt>수위</rt></ruby> <ruby>文明<rt>문명</rt></ruby>은 당시 사실상 각자 <ruby>各説各話<rt>각설각화</rt></ruby>를 하고 있었던 것입니다.</q></p>
            <p>그녀는 곧 덧붙였다。KOI-8을 비롯한 <ruby>同類<rt>동류</rt></ruby> <ruby>符號化<rt>부호화</rt></ruby>는、지금으로부터 약 <ruby>九十年<rt>구십년</rt></ruby> 전 Unicode <ruby>統一<rt>통일</rt></ruby> <ruby>標準<rt>표준</rt></ruby>의 <ruby>全球<rt>전구</rt></ruby> <ruby>普及<rt>보급</rt></ruby>에 따라 <ruby>歷史<rt>역사</rt></ruby>의 <ruby>舞臺<rt>무대</rt></ruby>에서 <ruby>悄然<rt>초연</rt></ruby>히 <ruby>退場<rt>퇴장</rt></ruby>했다。거의 半 <ruby>世紀<rt>세기</rt></ruby> 동안 <ruby>人工知能<rt>인공지능</rt></ruby> <ruby>模型<rt>모형</rt></ruby>의 <ruby>訓練<rt>훈련</rt></ruby> <ruby>語料庫<rt>어료고</rt></ruby>에서 이런 형식의 <ruby>文本<rt>문본</rt></ruby>은 <ruby>無視<rt>무시</rt></ruby>해도 좋을 만큼 드물어졌다는 것이다。</p>
            <p><q><ruby>電腦<rt>전뇌</rt></ruby>도 마찬가지입니다.</q> 현장에 <ruby>待機<rt>대기</rt></ruby> 중이던 <ruby>人形<rt>인형</rt></ruby> <ruby>言語學<rt>언어학</rt></ruby> <ruby>機器人<rt>기기인</rt></ruby> EISO-2200이 덧붙였다。그 <ruby>措辭<rt>조사</rt></ruby>는 늘 그렇듯 <ruby>精確<rt>정확</rt></ruby>하되 어떤 <ruby>感情色彩<rt>감정색채</rt></ruby>도 없었다。<q><ruby>關聯<rt>관련</rt></ruby> <ruby>訓練<rt>훈련</rt></ruby> <ruby>資料<rt>자료</rt></ruby>량이 <ruby>不足<rt>부족</rt></ruby>하여、<ruby>模型<rt>모형</rt></ruby>이 이것이 <ruby>系統的<rt>계통적</rt></ruby>인 <ruby>符號化<rt>부호화</rt></ruby> <ruby>誤謬<rt>오류</rt></ruby>임을 <ruby>識別<rt>식별</rt></ruby>하지 못하고 <ruby>眞正<rt>진정</rt></ruby>한 한자 <ruby>內容<rt>내용</rt></ruby>으로 <ruby>認識<rt>인식</rt></ruby>했습니다.</q></p>
            <p>다시 말해、<strong>아무도 읽어낼 수 없었던 것은 모두가 <ruby>誤謬<rt>오류</rt></ruby>의 열쇠를 사용했기 때문이다</strong>。<ruby>正確<rt>정확</rt></ruby>한 <ruby>解法<rt>해법</rt></ruby>은 KOI-8 <ruby>形式<rt>형식</rt></ruby>으로 <ruby>磁氣<rt>자기</rt></ruby> 디스크를 다시 읽은 다음 <ruby>當代<rt>당대</rt></ruby> Unicode <ruby>標準<rt>표준</rt></ruby>으로 <ruby>變換<rt>변환</rt></ruby>하는 것이었다。전 <ruby>過程<rt>과정</rt></ruby>은 약 <ruby>十七<rt>십칠</rt></ruby> 분이 걸렸다。그리고 이 방법은 <ruby>百年<rt>백년</rt></ruby> 전에는 어느 <ruby>情報工學<rt>정보공학</rt></ruby> <ruby>學生<rt>학생</rt></ruby>이나 입학 첫째 주에 익히는 상식이었다——다만 그 <ruby>科目<rt>과목</rt></ruby>은 이미 모든 <ruby>大學<rt>대학</rt></ruby>의 <ruby>課程表<rt>과정표</rt></ruby>에서 사라진 지 오래였다。</p>
            <p><ruby>解讀<rt>해독</rt></ruby> <ruby>班<rt>반</rt></ruby>은 사후에 밝혔다。<ruby>正確<rt>정확</rt></ruby>한 <ruby>版本<rt>판본</rt></ruby>의 <ruby>程序<rt>정서</rt></ruby>는 <ruby>標準<rt>표준</rt></ruby> <ruby>俄語<rt>아어</rt></ruby>로 작성되어 있었으며、<ruby>技術<rt>기술</rt></ruby> <ruby>論理<rt>논리</rt></ruby>가 <ruby>明確<rt>명확</rt></ruby>하고 <ruby>保存<rt>보존</rt></ruby> <ruby>狀態<rt>상태</rt></ruby>가 <ruby>完好<rt>완호</rt></ruby>하며、어떠한 <ruby>損傷<rt>손상</rt></ruby>이나 <ruby>暗號化<rt>암호화</rt></ruby>의 흔적도 없었다고。</p>
            <p>알려진 바에 따르면 <ruby>解體<rt>해체</rt></ruby> <ruby>作業<rt>작업</rt></ruby>은 다음 주에 <ruby>正式<rt>정식</rt></ruby>으로 <ruby>開始<rt>개시</rt></ruby>될 예정이다。이 <ruby>飛彈<rt>비탄</rt></ruby>들 <ruby>內部<rt>내부</rt></ruby>의 플루토늄과 우라늄-235는 아프리카 <ruby>超導<rt>초도</rt></ruby> <ruby>電池<rt>전지</rt></ruby> <ruby>聯合<rt>연합</rt></ruby> <ruby>工廠<rt>공장</rt></ruby>으로 <ruby>一括<rt>일괄</rt></ruby> <ruby>移送<rt>이송</rt></ruby>되어、<ruby>低濃縮<rt>저농축</rt></ruby> <ruby>處理<rt>처리</rt></ruby> 후 <ruby>民用<rt>민용</rt></ruby> <ruby>蓄能<rt>축능</rt></ruby> <ruby>電芯<rt>전심</rt></ruby>으로 <ruby>製造<rt>제조</rt></ruby>될 것이다。첫 <ruby>批<rt>비</rt></ruby> <ruby>製品<rt>제품</rt></ruby>은 <ruby>月球<rt>월구</rt></ruby> <ruby>定住地<rt>정주지</rt></ruby>와 <ruby>南極洲<rt>남극주</rt></ruby> <ruby>越冬<rt>월동</rt></ruby> <ruby>基地<rt>기지</rt></ruby> <ruby>居民<rt>거민</rt></ruby>에게 무료로 <ruby>配給<rt>배급</rt></ruby>되어 <ruby>暖房<rt>난방</rt></ruby> <ruby>設備<rt>설비</rt></ruby>의 <ruby>電源<rt>전원</rt></ruby>으로 쓰일 예정이라 한다。</p>
            <p>한 <ruby>世紀<rt>세기</rt></ruby> 반 전에 <ruby>凝固<rt>응고</rt></ruby>된 <ruby>末日<rt>말일</rt></ruby>의 <ruby>豫言<rt>예언</rt></ruby>이、이렇게 해서 그 <ruby>最終<rt>최종</rt></ruby>의 <ruby>行先地<rt>행선지</rt></ruby>에 다다르게 되었다。어느 집 <ruby>暖房<rt>난방</rt></ruby>기구、<ruby>極夜<rt>극야</rt></ruby> 속에서 켜지는 불빛으로。</p>
            <p><u>슈냐 설</u>이 <ruby>記者臺<rt>기자대</rt></ruby>를 떠나려던 참에、어딘가 <ruby>人群<rt>인군</rt></ruby> 속에서 한 마디가 날아왔다。<q>그럼 그 <ruby>十五年<rt>십오년</rt></ruby>은요？</q></p>

            <p><q>그 <ruby>十五年<rt>십오년</rt></ruby>은、</q> 그녀가 말했다。<q>우리가 <ruby>歷史<rt>역사</rt></ruby>를 기억하지 못한 데 치른 <ruby>授業料<rt>수업료</rt></ruby>입니다.</q></p>
