  <!-- 一封橫跨四百年的通信,寫成一首短詩:〈古騰堡〉問編碼,〈畢昇〉答統一,
       兩人翻遍古籍,終無定論。每一行落一個語意元素、一種標記
       (專名號/著重號/深字重/楷體/書名號甲式/書名號乙式/去偽斜體),
       七行讀完既是對照表,也是一則笑話——這是本站唯一能同時做到兩件事的
       篇幅。刻意不用下方 .Papers 的 KOI-8 故事:同一站講兩遍,第二遍就自動
       降格成裝飾。短句也讓每行剛好一欄,直排帶因此不再自己溢出底緣。

       The conceit, in English: Bi Sheng (膠泥活字, c. 1045, recorded in
       Shen Kuo's 夢溪筆談) and Gutenberg in Mainz argue about code points
       across four centuries — which is what earns the address block its
       reason to exist. Gutenberg needs ~300 sorts for 26 letters and is
       done; Bi Sheng cut thirty thousand — a clean hundredfold — and it
       still isn't enough. And then Unicode turns
       out to hold one table for every script on Earth, most of its million
       code points still empty. Two lifetimes of cutting type, and neither
       man fills a corner of it. He thinks so; he doesn't say so. They
       consult 字驗, the cipher chapter of 武經總要 (前集 卷十五, 1044): forty
       military situations mapped onto the forty characters of a five-word
       poem, a real Song codebook. They reach no conclusion. Fitting reading
       for two men who spent their lives turning language into
       interchangeable units.

       Two rows exist purely to show a mark BREAKING between neighbours,
       which is the part a single specimen can never demonstrate: 專名號 on
       two adjacent proper nouns, and 書名號甲式 on a title and its chapter.
       Note the difference in what the two adjacencies MEAN — adjacent 專名號
       are two separate names, adjacent 書名號 are one work and a part of it.
       Same typographic gap, opposite grammar.

       The poem used to float a `<code>` ghost beside every marked run,
       naming the element. The .MarkDiagram beside it now does that job
       better — the ghosts said «this is called <cite>», the diagram says
       «and this is what it becomes» — so they are gone, tag names and all.

       The console's 語意 module switch hands the whole <article> back to
       browser defaults through `--han-semantics: off` (semantics.css
       § Feature Toggles), so the 「前」state is REAL UA output — synthetic
       obliques and all — never an imitation we drew. That is also why the
       flag lands on the <article> and not the <figure>: a style query reads
       an ANCESTOR, so the caption (and everything outside the poem) has to
       stay out of the subtree it switches. -->

    <article>

      <!-- 專名號 covers the NAME only: 教育部《重訂標點符號手冊》修訂版
           marks 「<u>孫中山</u>先生」 and 「民族英雄<u>鄭成功</u>」 — the

      <!-- <var> — the one place in the poem where a variable is literally
           what it says. 〈字驗〉 numbers forty military situations 1–40 and
           keeps a forty-character 五言律詩 as the KEY: to report situation
           n you write the poem's nth character. The written character means
           nothing on its own — which is the Song-dynasty version of the
           KOI-8 story below («the right numbers, the wrong characters»).

           and the line states what encoding IS: the symbol is not its
           referent. Two <var> runs separated by prose — the mirror of the
           two adjacent <u> in row 1, which teach how neighbouring marks
           BREAK; here it is one variable recurring inside one line.

           `<var>` and `<i>` are the SAME rule in han.css — both are just
           `font-family: var(--han-font-accent)` (semantics.css). That is
           why the diagram gains no seventh bar and the 楷體 bar carries two
           tag labels instead: two names, one outcome. Naming the tag is
           about saying WHAT THIS IS, not about fetching a style.

           The runner-up, kept for a future argument:
           「<var>甲</var>事，取詩中第<var>甲</var>字。」— strictly better on
           accuracy (it GIVES the mechanism instead of commenting on it, and
           甲 takes two roles in one clause: the situation's ordinal and the
           character's position — 天干 being Chinese's ordinal system, 第甲字

           flatter. Rejected outright: any 甲子乙丑 reading of the 干支 as a
           COMBINATORIAL code (twenty-two characters for a sixty-year cycle —
           a lovely answer to 「拉丁二十三字」) — 甲子 is a concrete year name,
           a constant, and <var> would be the wrong tag. See
           docs/plans/station-semantics-specimen.md 第十六輪. -->
        <span><var>甲</var>事書一字，其字非<var>甲</var></span>
        <br />
      <!-- 書名號乙式 on a WESTERN title, rendered into Chinese. John

        <span>終無定論，另見<cite>真實字符論</cite></span>

      <h3>謎底竟是一行亂碼</h3>
      <p class="author">【本報月球特派員　<u>錢福興</u>　專電】</p>
<p class="Abstract"><cite>地球無核武協議</cite>簽署已屆十五年，最後一批冷戰飛彈仍未拆除——磁碟完好，讀出來卻是一片漢字天書。<u>權慧晶</u>教授一度主張那是<u>蘇聯</u>與<u>共產中國</u>的加密手段；備忘錄卻指向<dfn>KOI-8</dfn>：正確的數字，對應到<em>全然錯誤</em>的文字。彈體內的<ruby class="zhuyin">鈽<rt>ㄅㄨˋ</rt></ruby>下週移送民用儲能工廠。<a class="PaperJump" href="/articles/soviet-koi8-nuke/hant.html" data-article="soviet-koi8-nuke" data-edition="hant" title="閱讀全文">閱讀全文</a></p>

      <h3>谜底竟是一行乱码</h3>
      <p class="author">【本报月球特派员　<u>钱福兴</u>　专电】</p>
<p class="Abstract"><cite>地球无核武协议</cite>签署已届十五年，最后一批冷战飞弹仍未拆除——磁碟完好，读出来却是一片汉字天书。<u>权慧晶</u>教授一度主张那是<u>苏联</u>与<u>共产中国</u>的加密手段；备忘录却指向<dfn>KOI-8</dfn>：正确的数字，对应到<em>全然错误</em>的文字。弹体内的<ruby>钚<rt>bù</rt></ruby>下周移送民用储能工厂。<a class="PaperJump" href="/articles/soviet-koi8-nuke/hans.html" data-article="soviet-koi8-nuke" data-edition="hans" title="阅读全文">阅读全文</a></p>

      <h3>謎は一行の文字化けだった</h3>
      <p class="author">【本紙月面特派員　<u>錢福興</u>　特電】</p>
<p class="Abstract"><cite>地球非核協定</cite>の調印から十五年、最後の冷戦ミサイルはいまだ解体できずにいる——ディスクは無傷なのに、読み出せるのは漢字の天書ばかり。<u>權慧晶</u>教授は<u>ソ連</u>と<u>共産中国</u>の技術交流が史書よりはるかに<ruby>曖昧<rt>あいまい</rt></ruby>だと主張したが、覚書が指したのは<dfn>KOI-8</dfn>——正しい数値が、<em>まったく見当違いの文字</em>に対応してしまう。<a class="PaperJump" href="/articles/soviet-koi8-nuke/ja.html" data-article="soviet-koi8-nuke" data-edition="ja" title="全文を読む">全文を読む</a></p>
