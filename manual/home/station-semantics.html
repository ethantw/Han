      <h3>謎底竟是一行亂碼</h3>
      <p><cite>地球無核協議</cite>簽署已屆十五年，最後一批冷戰飛彈的封存磁碟卻無人能讀。破譯組成員<u>謝廖沙・林</u>翻查文獻時，讀到一份塵封九十年的技術備忘錄——頁首印著<u>蘇聯</u><u>標準委員會</u>的紅色徽章，內容涉及一套名為<dfn>KOI-8</dfn>的字元編碼規範。</p>

      <p>人形語言學機器人VELES-7補充：<q>訓練資料不足以令模型辨識這是編碼錯誤，而非真實的漢字。</q>換言之，<strong>沒有人讀得懂，是因為所有人用的都是錯誤的鑰匙</strong>——正確解讀全程，耗時十七分鐘。彈體內的<ruby class="zhuyin">鈽<rt>ㄅㄨˋ</rt></ruby>，下週移送民用儲能工廠。</p>

      <h3>谜底竟是一行乱码</h3>
      <p><cite>地球无核协议</cite>签署已届十五年，最后一批冷战飞弹的封存磁碟却无人能读。破译组成员<u>谢廖沙・林</u>翻查文献时，读到一份尘封九十年的技术备忘录——页首印着<u>苏联</u><u>标准委员会</u>的红色徽章，内容涉及一套名为<dfn>KOI-8</dfn>的字元编码规范。</p>
      <p>所谓<dfn>乱码</dfn>，是文件以某套对照表写成——字元各有码位<var>n</var>——却被另一套对照表强行解读的结果：正确的数字，对应到<em>全然错误</em>的文字。彼时的电脑，连<i lang="de">Schrödinger</i>这个名字都无法完整显示。</p>
      <p>人形语言学机器人VELES-7补充：<q>训练资料不足以令模型辨识这是编码错误，而非真实的汉字。</q>换言之，<strong>没有人读得懂，是因为所有人用的都是错误的钥匙</strong>——正确解读全程，耗时十七分钟。弹体内的<ruby>钚<rt>bù</rt></ruby>，下周移送民用储能工厂。</p>

      <h3>謎は一行の文字化けだった</h3>
      <p><cite>地球非核協定</cite>の調印から十五年、最後の冷戦ミサイルを封じたディスクは誰にも読めなかった。解読班の<u><ruby>謝廖沙<rt>セリョーシャ</rt></ruby>・林</u>は、九十年<ruby>眠<rt>ねむ</rt></ruby>り続けた技術覚書を偶然目にする——表紙には<u>ソ連</u><u>標準委員会</u>の赤い<ruby>徽章<rt>きしょう</rt></ruby>、内容は<dfn>KOI-8</dfn>と呼ばれる文字符号化規格に関するものだった。</p>
      <p><dfn>文字化け</dfn>とは、ある対応表で書かれた文書——文字はそれぞれ符号位置<var>n</var>を持つ——を、別の対応表で強引に読み解いたときに生じる<ruby>滑稽<rt>こっけい</rt></ruby>な結果である：正しい数値が、<em>まったく見当違いの文字</em>に対応してしまう。当時のコンピュータは、<i lang="de">Schrödinger</i>という名前さえ完全に表示できなかった。</p>
      <p>ヒューマノイド言語学ロボットVELES-7は<q>訓練データが不十分なため、モデルはこれが符号化エラーであると認識できないのだ</q>と補った。要するに、<strong>誰にも読めなかったのは、全員が間違った鍵を使っていたからだ</strong>——正確な解読に要した時間は十七分。弾体内のプルトニウムは、来週民生用蓄電工場へ移送される。</p>

      <p>소위 <dfn><ruby>亂碼<rt>난마</rt></ruby></dfn>란, 한 <ruby>對照表<rt>대조표</rt></ruby>로 작성된 <ruby>文書<rt>문서</rt></ruby>——<ruby>文字<rt>문자</rt></ruby>마다 코드 포인트 <var>n</var>이 있다——가 다른 <ruby>對照表<rt>대조표</rt></ruby>로 <ruby>强制<rt>강제</rt></ruby> <ruby>解讀<rt>해독</rt></ruby>될 때 생기는 결과다. 올바른 <ruby>數字<rt>수자</rt></ruby>가 <em>완전히 <ruby>誤謬<rt>오류</rt></ruby>의 <ruby>文字<rt>문자</rt></ruby></em>에 <ruby>對應<rt>대응</rt></ruby>되는 것이다. 당시의 <ruby>電腦<rt>전뇌</rt></ruby>는 <i lang="de">Schrödinger</i>라는 이름조차 온전히 표시할 수 없었다.</p>
      <p><ruby>人形<rt>인형</rt></ruby> <ruby>言語學<rt>언어학</rt></ruby> 로봇 VELES-7이 덧붙였다. <q><ruby>訓練<rt>훈련</rt></ruby> <ruby>資料<rt>자료</rt></ruby>가 <ruby>不足<rt>부족</rt></ruby>하여, <ruby>模型<rt>모형</rt></ruby>은 이것이 <ruby>符號化<rt>부호화</rt></ruby> <ruby>誤謬<rt>오류</rt></ruby>임을 <ruby>識別<rt>식별</rt></ruby>하지 못했습니다.</q> 다시 말해, <strong>아무도 읽어낼 수 없었던 것은 모두가 <ruby>誤謬<rt>오류</rt></ruby>의 열쇠를 사용했기 때문이다</strong>——<ruby>正確<rt>정확</rt></ruby>한 <ruby>解讀<rt>해독</rt></ruby>에 걸린 시간은 17分이었다. <ruby>彈體<rt>탄체</rt></ruby> 속 플루토늄은 다음 주 <ruby>民用<rt>민용</rt></ruby> <ruby>蓄能<rt>축능</rt></ruby> <ruby>工廠<rt>공장</rt></ruby>으로 <ruby>移送<rt>이송</rt></ruby>된다.</p>
