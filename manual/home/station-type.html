<!-- Station II・Typography — three-face specimen + heritage/punctuation copy. -->
<!-- no `data-wm` here on purpose: station②'s spectacle is the lead-type forme,
     and a giant watermark glyph behind it would be one background pattern too
     many. The forme itself is NOT a watermark — it sits in flow, full-bleed,
     with nothing painted over it (home/lead-forme.css § showpiece). -->
<section id="station-type" data-station="type" data-ground="b">
  <hgroup>
    <p>{{ stEyebrow }}</p>
    <h2>{{ stH2 }}</h2>
  </hgroup>
  <p>{{ stLede }}</p>

  <figure class="Illust" data-variant="faces">
    <ul class="Faces" lang="zh-Hant">
      <!-- 對照組 rows — the SAME line in the visitor's own national-standard
           system faces, small and grey (station-fonts.css § .Faces), each
           IMMEDIATELY before its heritage answer (灰黑/墨黑、灰明/墨明 —
           ziano demo's pairing): the reader sees their screen's daily
           default first, so the「降級」plays in reverse. The sentence
           already carries the tells: 廿/戶/北/美/爭 and three 辶 (迴/運).
           楷 gets no grey twin — the standard IS a handwriting spec, kai is
           the one place it belongs (ziano § why makes the same call). -->
      <li data-face="sans">
        超迴路運行廿載，即將增停台北，<br />萬戶爭睹雲軌美景
        <small>黑</small>
      </li>
      <li data-face="system">
        超<b>迴</b>路<b>運</b>行廿載，即將增停<b>台</b><b>北</b>，<br /><b>萬</b><b>戶</b>爭睹<b>雲</b>軌<b>美</b>景
        <small>黑</small>
      </li>

      <!-- Songti TC caveat (ziano why.css § .compare): that face quietly
           leans HERITAGE for a few chars (北 among our tells) — ziano blanks
           those cells per-char via document.fonts.check; a full-line
           specimen can't, so on the Mac this row understates the damage a
           little. PMingLiU / Noto Serif TC elsewhere follow the standard
           faithfully. -->
      <li data-face="serif">
        超迴路運行廿載，即將增停台北，<br />萬戶爭睹雲軌美景
        <small>明</small>
      </li>
      <li data-face="system-ming">
        超<b>迴</b>路<b>運</b>行廿載，即將增停<b>台</b><b>北</b>，<br /><b>萬</b><b>戶</b>爭睹<b>雲</b>軌<b>美</b>景
        <small>明</small>
      </li>
      <li data-face="cursive">
        超迴路運行廿載，即將增停台北，<br />萬戶爭睹雲軌美景
        <small>楷</small>
      </li>
    </ul>
    <!-- 護眼模式 — hides the two 對照組 rows. A real control, not a gag: once
         the reader has SEEN the standard forms, the grey rows are just noise
         between 黑 and 明, and the three heritage faces read better shoulder
         to shoulder. `.Toggle` is the shared switch primitive
         (home/controls.css), the same one station①'s 語意樣式 switch uses.
         Pure CSS (:has + :checked, station-fonts.css § 護眼模式) — no JS, and
         unlike station①'s this is NOT a console proxy: it changes nothing
         about the page's typography, only which rows of this one specimen
         are shown. -->
    <figcaption>
      <p>
        <span class="to-turn-on">{{ ltEyeCareOn }}</span>
        <span class="to-turn-off">{{ ltEyeCareOff }}</span>
        <label class="Toggle for-eyecare">
          <input type="checkbox" name="face-eyecare" />
          <span>{{ ltEyeCare }}</span>
        </label>
        <span class="to-turn-on note">{{ ltEyeCareOnNote }}</span>
        <span class="to-turn-off note">{{ ltEyeCareOffNote }}</span>

      <h3>{{ stHeritageH3 }}</h3>
      <p>{{ stHeritageP }}
    </figcaption>
  </figure>

  <!-- lead-type forme — the sentence「山田臉色鐵青：『我特地放棄瞬移艙改搭
        超迴路，就是因為快十二秒！』」set as mirrored isometric slugs; three
        heritage faces (Ziano 明／黑／楷) × three punctuation conventions
        (Diantenjeom JIS／MOE／GB) swap live from its own form. lead-forme.js
        builds the SVG; home/lead-forme.css themes it. The forme is a
        decorative specimen (svg aria-hidden); the caption (stTrayNote)
        carries the type-picking ↔ unicode-range story.
