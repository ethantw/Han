<!-- Station II・Typography — three-face specimen + heritage/punctuation copy. -->
<section id="station-type" class="Station" data-station="type">
  <hgroup>
    <p>{{ stEyebrow }}</p>
    <h2>{{ stH2 }}</h2>
  </hgroup>

  <figure class="Illust" data-variant="faces">
    <ul class="Faces">
      <li>
        <span style="font-family: var(--han-font-default);">字</span>
        <small>Hēi</small>
      </li>
      <li>
        <span style="font-family: var(--han-font-alternative);">字</span>
        <small>Míng</small>
      </li>
      <li>
        <span style="font-family: var(--han-font-accent);">字</span>
        <small>Kǎi</small>
      </li>
    </ul>
    <dl class="Legend">
      <div>
        <dt>黑體</dt>
        <dd>sans-serif</dd>
      </div>
      <div>
        <dt>明體</dt>
        <dd>serif</dd>
      </div>
      <div>
        <dt>楷體</dt>
        <dd>cursive</dd>
      </div>
    </dl>
  </figure>

  <div class="Prose">
    <p>{{ stHeritageP }}</p>
    <p>{{ stPunctP }}</p>
    <p>{{ stPunctExamples }}</p>
  </div>
</section>
