  pgStationSample: {
    hant: '<!-- 這是《太陽中文報》的一篇報導，當作範本。整篇刪掉，換你的字上場。 -->\n\n# 咀嚼二十二秒驚覺人間美味　巴拉克・川普與第一先生手牽手掃光魚生　唯海膽二人齊搖頭\n\n> <u>美國</u>總統<u>巴拉克・川普</u>於本屆<u>日內瓦</u>峰會「廚道輪席宴」首嚐生魚片，咀嚼<em>二十二秒</em>後驚呼<q>很好吃</q>。第一先生<u>卡里姆</u>率先示範破冰，二人隨即牽手將餐桌魚生與握壽司逐一掃盡，互相餵食，甜蜜入鏡。唯海膽一道，總統<ruby class="zhuyin">蹙<rt>ㄘㄨˋ</rt></ruby>眉：<q>只有這個我不明白。</q>笑稱晚了六十多年是一輩子遺憾。本次甜蜜同框，亦無聲打破近月「第三者介入」離婚傳言。\n\n## 第一先生出馬　大局底定\n\n【本報<u>日內瓦</u>特派員　<u>劉爭予</u>　專電】<u>美國</u>總統<u>巴拉克・川普</u>與第一先生<u>卡里姆</u>，昨日<ruby class="zhuyin">聯<rt>ㄌㄧㄢˊ</rt></ruby><ruby class="zhuyin">袂<rt>ㄇㄟˋ</rt></ruby>出席本屆「廚道輪席宴」。宴席第三道，本鮪生魚片——那道<u>巴拉克・川普</u>六十餘載人生從未碰觸過的東西。\n\n（編按：「<dfn>廚道輪席宴</dfn>」為<u>日內瓦</u>和平峰會行之卅餘年之傳統環節，各國元首依序輪值，呈獻本國代表料理，並品嚐對席元首所上菜式。本屆<u>川普</u>總統抽籤輪值<u>日本</u>料理——以生食聞名於世，消息一出，已在各方觀察員間引發廣泛討論。）\n\n自幼以漢堡牛排為主食的總統，面對那一片<ruby class="zhuyin">瑩<rt>ㄧㄥˊ</rt></ruby>白的鮪魚腹，沉默了整整<em>十七秒</em>。十二名幕僚已在側嚴陣以待（幕僚長、食安沙皇、<u>白宮</u>主廚<u>富－僑・博庫斯</u>、官銜為「<dfn>生食翻譯官</dfn>」之專員，及不斷低聲呢喃<q>沒事的、沒事的</q>的<u>海野博士</u>等），大氣不敢多出一口。\n\n<u>卡里姆</u>先生不發一語，不疾不徐地夾起一片，一口吃下，側過臉來，對身為總統的丈夫溫和説了一句：<q>還不錯。</q>\n\n現場觀察員事後評述：<q>那句話，比<u>白宮</u>十二名幕僚的全部準備工作加起來還管用。</q>\n\n## 二十二秒　歷史定格\n\n午後一時十七分，總統夾起一片本鮪，緩緩送入口中。在場記者一律屏息，懷錶秒針聲清晰可聞。咀嚼整整<em>二十二秒</em>（多家媒體交叉計時為證），總統嚥下，舉<ruby class="zhuyin">箸<rt>ㄓㄨˋ</rt></ruby>微顫，以其苦學八載之華語徐徐吐出：<q>我覺得⋯⋯還不錯？</q>\n\n隨即，表情一變。\n\n<q>——<em>很好吃</em>！</q>\n\n幕僚長率先鼓掌，餘者跟進，掌聲一度蓋過鄰桌的外交對話。<u>海野博士</u>將急救包悄悄收回包內。總統側身低喃，這句話是説給丈夫聽的，不是幕僚：<q>你早就知道吧。</q><u>卡里姆</u>微微一笑，不置可否。\n\n## 牽手掃盤　魚生告罄\n\n此後半小時，堪稱本屆輪席宴最意外的外交奇景。<u>巴拉克・川普</u>牽起<u>卡里姆</u>的手，二人肩並肩坐定，將餐桌上的魚生逐一品嚐：鮪魚腹、鮭魚、<ruby class="zhuyin">鰤<rt>ㄕ</rt></ruby>魚、干貝，再試了握壽司一輪，從玉子燒吃到海蝦，總統每吃一樣便轉頭看向<u>卡里姆</u>，<u>卡里姆</u>便點一次頭，二人合拍程度令旁觀的十二名幕僚目瞪口呆。席間二人亦多次互相夾菜餵食，甜蜜之態令現場攝影師快門聲此起彼落。\n\n唯有一樣，總統停箸不前。\n\n他以筷子遙指那一小盅金黃，<ruby class="zhuyin">蹙<rt>ㄘㄨˋ</rt></ruby>眉道：<q>只有這個，我不明白。</q>\n\n是海膽。\n\n<q>其他都好美味，</q>他説，<q>但這個⋯⋯</q>他搖搖頭，沒有繼續。<u>卡里姆</u>亦搖搖頭，二人難得意見一致，引發周遭一陣善意的笑聲。\n\n席間，本報記者側身採訪第一先生。<u>卡里姆</u>淡然一笑，以流利普通話回應：<q>我本來就不像小巴一樣挑食，只要是清真認證（<i lang="ar-Latn">halal</i>，<bdi lang="ar">حلال</bdi>）的，我通常不會猶豫下肚。</q>「小巴（<i lang="en">Barnie</i>）」二字一出，旁側幕僚明顯繃緊，而總統本人渾然未覺，正全神貫注地盯著那盅海膽——顯然，「小巴」並非新名詞。\n\n## 六十年遺憾　離婚傳言俱消\n\n記者會上，有人追問感想，總統正色道：<q>晚了六十多年才吃下第一口魚生，是我這輩子<em>最大的遺憾</em>。</q>語畢長嘆，又補上一句：<q>比大麥克好吃。</q>掌聲再起。\n\n總統隨即收起笑容，神情一肅，進入官腔模式：<q>食物，是超越語言、超越意識形態的最佳媒介。一口好的料理，往往能達成數十年外交斡旋所無法完成的事。</q>\n\n話音<ruby class="zhuyin">甫<rt>ㄈㄨˇ</rt></ruby>落，全場掌聲。\n\n有記者在掌聲中舉手追問：<q>總統閣下，那海膽呢？</q>\n\n總統微微一頓，轉頭瞥了丈夫一眼。\n\n<q>海膽，</q>他説，<q>需要更多的跨文明對話時間。</q>\n\n<u>彭博</u>、<u>BBC</u>及<u>廣場</u>同步直播的鏡頭，將那幕交握的手定格在全球四十億個螢幕上。數日來沸沸揚揚的「第三者介入」離婚傳言，在此刻無聲瓦解——沒有任何公關聲明，沒有官方否認，只有兩個丈夫交握的手，以及一盤始終未被碰觸的海膽。\n\n#TrumpChews標籤兩小時內衝上全球熱搜第一，<u>東京</u><u>豐洲市場</u>本鮪當日成交價漲百分之七，連帶醬油業股票同步攀升。第一先生<u>卡里姆</u>列同日熱搜第三，關鍵字為「卡里姆的筷子」；另有一條意外竄升至第七的標籤：#海膽他們都不吃。<u>白宮</u>新聞官事後表示，總統晚餐已預約鮭魚卵丼，<q>這次不需要翻譯官了</q>。',
    hans: '## 咀嚼二十二秒　惊觉人间美味\n\n【本报<u>日内瓦</u>特派员　专电】<u>美国</u>总统<u>巴拉克・川普</u>于「厨道轮席宴」首尝生鱼片，咀嚼<em>二十二秒</em>后惊呼「很好吃」——第一先生卡里姆率先示范破冰，二人随即牵手将鱼生逐一扫尽。\n\n> 唯海胆一道，总统蹙眉：「只有这个我不明白。」\n\n删掉这段，换你的字上场——<ruby class="zhuyin">汉<rt>ㄏㄢˋ</rt></ruby><ruby class="zhuyin">字<rt>ㄗˋ</rt></ruby>注音随字而至；面板一拨书名号，<cite>本草纲目</cite>自入《》。',
    en: '## Twenty-two seconds of chewing\n\n【Geneva dispatch】President <u>Barack Trump</u> tastes sashimi at the state dinner — <em>twenty-two seconds</em> of chewing, then: “tasty.” First Gentleman Karim broke the ice first.\n\n> Only the uni drew a frown: “This one I don’t understand.”\n\nDelete this and bring your own words — ruby <ruby class="zhuyin" lang="zh-Hant">漢<rt>ㄏㄢˋ</rt></ruby><ruby class="zhuyin" lang="zh-Hant">字<rt>ㄗˋ</rt></ruby> follows your text; flip Title marks in the panel and <cite lang="zh-Hant">本草綱目</cite> gains its 《》.',
    ja: '## <ruby>咀嚼<rt>そしゃく</rt></ruby>二十二秒、人間の美味に目覚める\n\n【本紙ジュネーブ特派員】<u>米国</u>大統領<u>バラク・トランプ</u>は「<ruby>厨道輪席宴<rt>ちゅうどうりんせきえん</rt></ruby>」で刺身を初めて口にし、<em>二十二秒</em>の咀嚼ののち「うまい」と叫んだ——ファーストジェントルマンのカリムが先に手本を示した。\n\n> <ruby>雲丹<rt>うに</rt></ruby>だけには眉をひそめた。「これだけは分からない」\n\nこの段落を消して、あなたの文を——<ruby class="zhuyin">漢<rt>ㄏㄢˋ</rt></ruby><ruby class="zhuyin">字<rt>ㄗˋ</rt></ruby>の注音は字に添って現れる。パネルで書名号を入れれば、<cite>本草綱目</cite>は自ずと《》をまとう。',
    ko: '## <ruby>咀嚼<rt>저작</rt></ruby> 22秒、<ruby>人間<rt>인간</rt></ruby>의 맛에 눈뜨다\n\n【<ruby>本紙<rt>본지</rt></ruby> 제네바 <ruby>特派員<rt>특파원</rt></ruby>】<ruby>美國<rt>미국</rt></ruby> <ruby>大統領<rt>대통령</rt></ruby> <u>바라크 트럼프</u>가 「<ruby>廚道輪席宴<rt>주도윤석연</rt></ruby>」에서 <ruby>膾<rt>회</rt></ruby>를 처음 맛보고、<em>22秒</em>를 씹은 끝에 「맛있습니다」라고 외쳤다——퍼스트 젠틀맨 카림이 먼저 시범을 보였다.\n\n> 성게만은 눈살을 찌푸렸다。「이것만은 모르겠습니다」\n\n이 <ruby>段落<rt>단락</rt></ruby>을 지우고 당신의 글을——<ruby class="zhuyin">漢<rt>ㄏㄢˋ</rt></ruby><ruby class="zhuyin">字<rt>ㄗˋ</rt></ruby>의 <ruby>注音<rt>주음</rt></ruby>은 <ruby>字<rt>자</rt></ruby>를 따라 나온다。패널에서 <ruby>書名號<rt>서명호</rt></ruby>를 켜면 <cite><ruby>本草綱目<rt>본초강목</rt></ruby></cite>가 절로 《》를 두른다。',

<!-- Station V・Playground — the user types their OWN Markdown / HTML and
     watches han.css typeset it. Two radio tabs (preview default) mirror
     station④'s ViewTabs; `.Preview` supplies the framed-panel primitive,
     `.Playground` the editor-specific children. The preview is a plain
     <article> INSIDE main.han, so the console's `--han-*` config vars and the
     metric sliders reach it with zero wiring (prose layer auto-scopes to
     <article>). Render pipeline lives in home/playground.js:
     marked(Markdown, inline HTML passes through) → DOMPurify(sanitize) →
     article.innerHTML. The <textarea> ships the default sample; the module
     restores localStorage over it on boot (console Reset never touches it — it
     is content, not config). -->
<section id="station-playground" class="Station Playground" data-station="playground" data-wm="樂">
  <!-- The 認真模式 switch rides in the station head, on the <h2>'s line.
       It sits AFTER the lede in source so `h2 + p` (frame.css's lede rule)
       still matches; the grid in station-playground.css puts it back on
       the heading row. -->
  <hgroup>
    <p>{{ pgStationEyebrow }}</p>
    <h2>{{ pgStationH2 }}</h2>
    <p>{{ pgStationLede }}</p>
    <!-- One control strip for the station: which text is being typeset on
         the left, the focus switch on the right. -->
    <div class="PgControls">
      <fieldset class="ViewTabs" data-pg-content-tabs>
        <legend class="sr-only">{{ pgContentLegend }}</legend>
        <label><input type="radio" name="pg-content" value="story" checked>{{ pgContentStory }}</label>
        <label><input type="radio" name="pg-content" value="custom">{{ pgContentCustom }}</label>
      </fieldset>

      <!-- Still a checkbox (checked ⇒ in the studio, so the switch and the
           reality can't drift), but its face is a button: entering is an
           action, and a switch would promise a way back the modal doesn't
           give. The input is visually hidden — the `for=`/`id=` pair is what
           makes the label操作得動 it, and `:focus-visible` on the input
           paints the ring on the label. -->
      <input type="checkbox" id="pg-focus" class="sr-only" data-pg-focus>
      <label class="PgFocus" for="pg-focus">{{ pgFocusEnter }}</label>
    </div>
  </hgroup>

  <div class="Preview Playground" data-playground>
    <header>
      <fieldset class="ViewTabs" data-pg-editor-views>
        <legend class="sr-only">{{ pgStationViewsLegend }}</legend>
        <label><input type="radio" name="pg-editor-view" value="preview" checked>{{ pgStationTabPreview }}</label>
        <label><input type="radio" name="pg-editor-view" value="code">{{ pgStationTabCode }}</label>
      </fieldset>
    </header>

    <!-- code tab = raw source, preview tab = typeset result; CSS
         (:has(:checked)) shows one at a time. The textarea value is
         RCDATA, so the sample's <ruby>/<em> tags sit here literally. -->
    <!-- 自訂內容's default lives in raw-text element content, not in a
         `data-*`: an attribute placeholder gets its markup stripped and its
         line breaks collapsed by the templating, and this default is
         multi-line Markdown with inline HTML in it. `type="text/plain"`
         keeps the browser from executing or rendering anything. -->
    <script type="text/plain" data-pg-custom-default>{{ pgCustomSample }}</script>
    <!-- 兩塊窗格自成一個盒：窄站台下它就是那條可以左右滑的軌（吸附一格一
         格走，home/playground.js § swipe 讓藥丸與滑到哪裡互相對齊），寬站台
         下它是那張兩欄的網格。認真模式把兩塊窗格借走時，它們離開這個盒，
         所以借出期間所有 `[data-pg-panes] >` 的規則自動失效。 -->
    <div class="PgPanes" data-pg-panes>
    <textarea data-pg-src spellcheck="false" aria-label="{{ pgStationCodeLabel }}">{{ pgStationSample }}</textarea>
    <!-- The paper card: masthead + dateline are CHROME, outside the editable
         article — the date is computed fresh every load (playground.js ←
         papers-dateline.js), so it can never be pickled into a reader's
         localStorage draft. The baked text below is the no-JS face, same
         arrangement as station①'s .Papers. -->
    <!-- The sheet unit: the paper plus the loupe's switch. They are one grid
         item so the switch always sits directly under the sheet — the card
         is `translate`d and the grid's own rows are sized by the taller
         editor, so nothing else keeps the two together. -->
    <div class="PgSheet" data-pg-sheet>
    <div class="PgPaper" data-pg-paper data-lens="live">
      <p class="Masthead">{{ pgPaperMasthead }}</p>
      <p class="Dateline"><time data-pg-dateline datetime="2126-08-10">中華民國二一五年八月十日・夏曆丙戌年六月廿二・弘宙元年八月十日・西元二一二六年八月十日</time></p>
      <!-- `tabindex="0"`: in the wide layout the reading mode scrolls, and a
           scrollable region the keyboard can't reach is a serious axe
           violation (scrollable-region-focusable). In tab mode it's one
           extra tab stop with an accessible name — a fair price. -->
      <article class="PgGalley" data-pg-preview tabindex="0" aria-label="{{ pgPaperColumn }}"></article>
    </div>
    </div>
    </div>

    <!-- 認真模式 — a fullscreen modal studio. Opening MOVES the two live
         panes (textarea + paper) into the dialog body and back: same nodes,
         so the draft, its listeners and the rendered preview survive the
         trip untouched. Exit is the ✕ only (Esc is cancelled in JS) — the
         whole point is that nothing scrolls out from under you. -->
    <dialog class="PgStudio" data-pg-studio aria-label="{{ pgFocusTitle }}">
      <!-- The content tabs are MOVED in here on open (playground.js) — the
           same fieldset, so switching 報導／自訂內容 works identically inside
           and out, with no second copy of the state to keep in step. -->
      <header data-pg-studio-head>
        <span>{{ pgFocusTitle }}</span>
        <button type="button" data-pg-studio-close aria-label="{{ pgFocusClose }}">
          <span data-icon="close" aria-hidden="true"></span>
        </button>
      </header>
      <div data-pg-studio-body></div>
    </dialog>
  </div>
</section>
