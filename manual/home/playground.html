<!--
  Playground section — interactive specimen.

  Five sample chips swap the preview's source HTML; a sixth chip
  (✎ 自訂) flips into a Markdown editor (left) + live render (right)
  inside the same preview frame.  Toggles flip cascade vars on the
  preview body so Han.css's own CSS handles them; sliders write
  inline `font-size` / `line-height` / `letter-spacing`.  The DOM-
  level `installFallbacks` re-runs only when the source HTML changes
  (sample switch / Markdown re-render) — pure-CSS toggle the rest of
  the time.

  Sample HTML lives co-located in `<template>` blocks below so it can
  be edited without touching JS.  All five carry deliberately mixed
  punctuation, Han ↔ Latin runs, and (where applicable) zhuyin /
  furigana ruby so each toggle has something to do.
-->
<section id="playground" class="Playground" data-pg>
  <header class="SectionHead">
    <div data-part="meta">
      <span data-part="numeral">叁</span>
      <span data-part="label">{{ pgEyebrow }}</span>
      <span data-part="rule"></span>
    </div>
    <h2>{{ pgH2 }}</h2>
    <p>{{ pgLede }}</p>
  </header>

  <div class="Body">
    <!-- ─── Left: controls ─────────────────────────────────────── -->
    <aside class="Controls">
      <!-- 範文 chips (5 langs + 自訂) -->
      <section class="ControlGroup">
        <header>{{ pgSampleLabel }}</header>
        <div class="SampleChips" data-pg-chips>
          <button type="button" class="Chip is-active" data-sample="zh-Hant">{{ pgChipHant }}</button>
          <button type="button" class="Chip" data-sample="zh-Hans">{{ pgChipHans }}</button>
          <!-- <button type="button" class="Chip" data-sample="en">{{ pgChipEn }}</button> -->
          <button type="button" class="Chip" data-sample="ja">{{ pgChipJa }}</button>
          <button type="button" class="Chip" data-sample="ko">{{ pgChipKo }}</button>
          <button type="button" class="Chip" data-variant="custom" data-sample="custom" title="{{ pgChipCustomEn }}">{{ pgChipCustom }}</button>
        </div>
      </section>

      <!-- 規則 toggles (4) -->
      <section class="ControlGroup">
        <header>{{ pgRulesLabel }}</header>
        <fieldset class="PlaygroundRules" data-pg-toggles>
          <label class="Toggle">
            <span>
              {{ pgTogPunct }}
              <small>{{ pgTogPunctEn }}</small>
            </span>
            <input type="checkbox" data-rule="punct" checked>
          </label>
          <label class="Toggle">
            <span>
              {{ pgTogMix }}
              <small>{{ pgTogMixEn }}</small>
            </span>
            <input type="checkbox" data-rule="mix" checked>
          </label>
          <label class="Toggle">
            <span>
              {{ pgTogHang }}
              <small>{{ pgTogHangEn }}</small>
            </span>
            <input type="checkbox" data-rule="hang" checked>
          </label>
          <label class="Toggle">
            <span>
              {{ pgTogRuby }}
              <small>{{ pgTogRubyEn }}</small>
            </span>
            <input type="checkbox" data-rule="ruby" checked>
          </label>
        </fieldset>
      </section>

      <!-- 度量 sliders (3) -->
      <section class="ControlGroup">
        <header>{{ pgMetricsLabel }}</header>
        <div class="MetricSliders" data-pg-sliders>
          <div class="MetricSlider" data-metric="size" data-unit="px" data-precision="0">
            <header>
              <span data-part="label">{{ pgSliderSize }}</span>
              <span data-part="label-en">{{ pgSliderSizeEn }}</span>
              <output data-part="val" data-pg-slider-val>17 px</output>
            </header>
            <div data-part="track">
              <div data-part="fill" data-pg-slider-fill></div>
              <input type="range" min="14" max="28" step="1" value="17"
                     aria-label="{{ pgSliderSize }} {{ pgSliderSizeEn }}">
            </div>
          </div>

          <div class="MetricSlider" data-metric="leading" data-unit="" data-precision="2">
            <header>
              <span data-part="label">{{ pgSliderLeading }}</span>
              <span data-part="label-en">{{ pgSliderLeadingEn }}</span>
              <output data-part="val" data-pg-slider-val>1.85</output>
            </header>
            <div data-part="track">
              <div data-part="fill" data-pg-slider-fill></div>
              <input type="range" min="1.4" max="2.4" step="0.05" value="1.85"
                     aria-label="{{ pgSliderLeading }} {{ pgSliderLeadingEn }}">
            </div>
          </div>

          <div class="MetricSlider" data-metric="tracking" data-unit="em" data-precision="2">
            <header>
              <span data-part="label">{{ pgSliderTracking }}</span>
              <span data-part="label-en">{{ pgSliderTrackingEn }}</span>
              <output data-part="val" data-pg-slider-val>0.02 em</output>
            </header>
            <div data-part="track">
              <div data-part="fill" data-pg-slider-fill></div>
              <input type="range" min="-0.04" max="0.12" step="0.01" value="0.02"
                     aria-label="{{ pgSliderTracking }} {{ pgSliderTrackingEn }}">
            </div>
          </div>
        </div>
      </section>
    </aside>

    <!-- ─── Right: preview ─────────────────────────────────────── -->
    <div class="Preview">
      <header>
        <span data-part="label">{{ pgPreviewLabel }}</span>
        <output data-part="meta" data-pg-meta>zh-Hant・17 px</output>
      </header>

      <div data-part="stage">
        <textarea
          data-part="custom-input"
          data-pg-custom-input
          spellcheck="false"
          placeholder="{{ pgCustomPlaceholder }}"
          hidden></textarea>

        <article
          class="han"
          data-pg-body
          data-rule-punct="on" data-rule-mix="on"
          data-rule-hang="on" data-rule-ruby="on"
          lang="zh-Hant"></article>
      </div>
    </div>
  </div>

  <!-- ─── Sample sources (read by playground.js, never rendered) ─── -->

  <template data-pg-sample="zh-Hant" data-lang="zh-Hant" data-meta="zh-Hant・注音・Noto Serif KR">
    <p>「東京晴空塔」（<ruby class="zhuyin">塔<rt>ㄊㄚˇ</rt></ruby>，Tokyo Skytree）為日本之地標，於 2011 年竣工，塔高 634 公尺。塔身輕盈如青翠之筍，破雲而出，<em>遠望尤甚</em>。</p>
    <p>「夜幕初垂，燈火萬點。」遊人佇立於展望台，俯瞰東京全景——隅田川蜿蜒，<em>浮世繪</em>之趣，盡收眼底。</p>
  </template>

  <template data-pg-sample="zh-Hans" data-lang="zh-Hans" data-meta="zh-Hans・pīnyīn・Noto Serif SC">
    <p>中国传统排版有着两千余年的历史——从甲骨文、金文，到雕版印刷（woodblock）、活字（movable type）与激光照排，每一次技术变革都重塑了汉字的视觉形态。</p>
    <p>「字者，孳也。」<em>知其形，方能识其神。</em>从《说文解字》到 Unicode 标准，字形的传承与编码始终相互呼应。</p>
  </template>

  <template data-pg-sample="en" data-lang="en" data-meta="en・Cormorant Garamond">
    <p>Typography is the craft of arranging type to make written language legible, readable, and appealing when displayed. Good typography establishes a visual hierarchy and provides a graphic balance to the page.</p>
    <p><em>"The details are not the details. They make the design."</em> — Charles Eames, on the discipline of looking closely at things you would otherwise take for granted.</p>
  </template>

  <template data-pg-sample="ja" data-lang="ja" data-meta="ja・ふりがな・Noto Serif JP">
    <p>「<ruby>東京<rt>とうきょう</rt></ruby><ruby>晴空塔<rt>スカイツリー</rt></ruby>」は、東京都<ruby>墨田区<rt>すみだく</rt></ruby><ruby>押上<rt>おしあげ</rt></ruby>にある電波塔である。高さは 634 メートルで、自立式電波塔としては世界一の高さを誇る（2011 年完成）。</p>
    <p>夜間にはライトアップされ、隅田川の対岸からも望むことができる——<em>下町</em>の風情と相まって、新たな名所となっている。</p>
  </template>

  <template data-pg-sample="ko" data-lang="ko" data-meta="ko・한글・Noto Serif KR">
    <p>한글은 1443년에 조선의 세종대왕이 창제하여 1446년 「<em>훈민정음</em>」이라는 이름으로 반포한 한국어의 문자 체계이다.</p>
    <p>「나랏말싸미 듕귁에 달아」 ——이 문장으로 시작되는 훈민정음 서문은, <em>500여 년</em>이 지난 오늘날에도 그 의의를 잃지 않았다.</p>
  </template>

  <template data-pg-sample="custom-default" data-lang="zh-Hant" data-meta="custom・Markdown">
# 試試看

在此貼上你的 Markdown 文字，**著重**、`程式碼`、引文 ——

> 字者，孳也。文字之繁衍，乃文明之綿延。

——皆會即時渲染於右。
  </template>
</section>
