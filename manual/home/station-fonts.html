<!-- Station II・Typography — three-face specimen + heritage/punctuation copy. -->
<section id="station-fonts" data-station="type">

      <li data-face="sans">
        超迴路運行廿載，即將增停台北，<br />萬戶爭睹雲軌美景
        <small>黑</small>
      </li>
      <li data-face="serif">
        超迴路運行廿載，即將增停台北，<br />萬戶爭睹雲軌美景
        <small>明</small>
      </li>
      <li data-face="cursive">
        超迴路運行廿載，即將增停台北，<br />萬戶爭睹雲軌美景
        <small>楷</small>
      </li>
    </ul>
    <figcaption>
      <h3>{{ stHeritageH3 }}</h3>
      <p>{{ stHeritageP }} <a class="PaperJump" href="/articles/hyperloop-12sec/hant.html" data-article="hyperloop-12sec" title="閱讀完整報導">閱讀完整報導</a>
    </figcaption>
  </figure>

  <!-- lead-type forme — the sentence「石田臉色鐵青：『我特地放棄瞬移艙改搭
        超迴路，就是因為快十二秒！』」set as mirrored isometric slugs; three
        heritage faces (Ziano 明／黑／楷) × four punctuation conventions
        (Diantenjeom JIS／MOE／GB／KLR) swap live from its own form. lead-forme.js
        builds the SVG; home/lead-forme.css themes it. The forme is a
        decorative specimen (svg aria-hidden); the caption (stTrayNote)
        carries the type-picking ↔ unicode-range story.

        位置在傳承字形與標點之間，是刻意的接縫：
        (1) 那句話是標點濃度極高的一句（`：「`…`，`…`！」`，加上直排禁則、
            段首空鉛、末欄小鉛塊填版框），不是為傳承字形挑的字——挑傳承 tell
            的是上面 .Faces 那行（美/戶/情/紀/運/廿）。所以它開啟標點那半，
            stTwoEmDashesP 緊接著回答它讓人玩出來的疑問（「咦『」形狀變了」）。
        (2) 擺在 .Faces 之後會讓黑／明／楷這條軸連著出現兩次——樣張剛並排完
            三體，鉛字盤第一個 fieldset 又是同三體。隔一段字形論述，它再出現
            才帶得動新東西（多一個標點軸）。
        代價是 .Faces 那行（超迴路增停台北）與這句（乘客抱怨同一條超迴路）的
        報導↔民眾反應對仗被隔開一段——stHeritageP 只有一句，梗接得住。 -->

  <figure class="LeadForme" data-face="m" data-lang="{{ lfHomeLang }}" data-punct="{{ lfHomePunct }}" data-orient="v" data-reveal-at="0.6">
    <svg role="img" aria-hidden="true"></svg>
    <form class="Controls" aria-label="{{ ltControls }}">
      <fieldset aria-labelledby="lf-lg-face">
        <span class="PillHead" id="lf-lg-face">{{ ltFaceLegend }}</span>
        <label><input type="radio" name="lf-face" value="m" checked /> {{ ltFaceM }}</label>
        <label><input type="radio" name="lf-face" value="h" /> {{ ltFaceH }}</label>
        <label><input type="radio" name="lf-face" value="k" /> {{ ltFaceK }}</label>
      </fieldset>
      <fieldset aria-labelledby="lf-lg-punct">
        <span class="PillHead" id="lf-lg-punct">{{ ltPunctLegend }}</span>

        <label><input type="radio" name="lf-punct" value="jis" /><abbr class="acronym">JIS</abbr></label>
        <label><input type="radio" name="lf-punct" value="moe" /><abbr class="acronym">MOE</abbr></label>
        <label><input type="radio" name="lf-punct" value="gb" /><abbr class="acronym">GB</abbr></label>
        <label><input type="radio" name="lf-punct" value="klr" /><abbr class="acronym">KLR</abbr></label>

      <fieldset aria-labelledby="lf-lg-lang">
