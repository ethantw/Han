             的落點，lead-forme.js 開機時照 data-punct 補。語言組同理。 -->

  <!-- 先以stTwoEmDashesP收束傳承字形的骨架、覆蓋與遞送，再由stPunctP
        合併說明標點的「修好」（碼位被西文字體搶走的破折號／刪節號／
        間隔號）與「可選」（Diantenjeom 4×2標點字體的地域公約／自訂混搭）。
        LangDemo figure接著實況示範。stSqueezeP收在最後——標點擠壓是獨立於
        「選哪種標點」的加分項，跟前面的地域公約／自訂選擇沒有因果關係，
        放在示範之後單獨收尾。

        .TwoEmDashes 也載著破折號底圖（dash-fuse.css）：一柱直排
        「起身後，他沉默了四點七秒——足夠交換十萬年的知識——然後說⋯⋯」畫在
        z-index:-1（站台早有的底圖層，同 watermark）。這句話裡有**一對**破折號，
        兩顆都是 `.Cell`，都吃同一套 scroll 開合（`animation-timeline: view()`
        各自算自己的進度）。柱以 .TwoEmDashes 為包含塊，上緣切在**鉛字盤左下角
        那顆鉛字**的下緣（clip-path，切線由 dash-clip.js 量），第一顆破折號緊接
        在切線之下、兩段文案之上，第二顆在十二格之後、落在文案與四語標點之間的
        空氣裡（2026-08-28 改；先前是從樣張卡下緣起、單一破折號）。
        破折號兩態都用 <rect> 畫，不掛 DTJ 字體：兩態本來就是同一組幾何的
        兩個值，交給字體反而要照著引擎擺放 R-class 字符的規矩走（那 5.25
        的 hhea 偏移），而且得把 `——` 與漢字塞進同一個 <text> 才能讓 ccmp
        開火。純幾何一概免掉，破折號正好落在欄軸上。 -->
  <!-- data-reveal-at 淺門檻（0.15 ＝ 露出一絲就算）：本欄緊接鉛字盤之下，
       所以「本欄露臉」就等於「已滾到鉛字以下」，正是兩段文案該飛入的時機。
       不能省掉這個屬性——reveal.js 的目標選擇器是
       `.Manifesto, [data-station], [data-reveal-at]`，拿掉它本欄就不再是
       reveal 目標，data-revealed 永遠不會蓋，柱的首播也就跟著卡死。 -->
  <div class="TwoEmDashes" data-reveal-at="0.15" data-excerpt-type="{{ telepathyDashType }}" data-verbatim="{{ telepathyDashVerbatim }}" style="--df-copy-cells: {{ stDashCells }}; --df-punct-cell: {{ stDashPunctCell }}">
    <!-- 底圖那一柱：一句直排的話，中間一個破折號。

         **句子是 HTML，只有破折號那兩格是 SVG**（2026-08-15 改）。原本整柱都在
         一個 `<svg>` 裡，是為了讓兩截破折號能以次像素精度開合；動畫撤下之後那個
         理由沒了，而 SVG 的代價還在——WebKit 的 SVG 直排文字不能用（字距讀 hhea
         而非 vmtx、不套 `vert`），所以那六十個字得由 JS 逐格算座標擺，柱頂還得
         再量一次才知道裁在哪。交還給 HTML 之後兩支 JS 都不必存在：直排由引擎排，
         位置由字級決定（見 dash-fuse.css § 柱）。

         那兩格仍是 SVG：破折號要能在未來的互動裡以次像素開合，而那是 CSS 畫不出
         來的東西。空的 inline-block 佔位負責在行裡站對位置，`<svg>` 絕對定位在它
         裡面只管畫——inline `<svg>` 的基線在 Chrome 不等於它的下緣，直接塞進行內
         會歪（docs/notes/2026-07-21-svg-glyph-baseline-alignment.md）。

         這句話因此成了 han.css 排的正文：背景那句裡的破折號與逗號由自家模組經手，
         比畫出來更有說服力。 -->
    <p class="Column" lang="{{ stDashLang }}" aria-hidden="true">{{ stDashLead }}<span class="Cell"><svg viewBox="0 0 100 200" aria-hidden="true" focusable="false"><defs><linearGradient id="df-ribbon-a1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" data-stop="0" /><stop offset=".5" data-stop="1" /><stop offset="1" data-stop="2" /></linearGradient><linearGradient id="df-ribbon-b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" data-stop="2" /><stop offset=".5" data-stop="3" /><stop offset="1" data-stop="4" /></linearGradient></defs><rect data-seg="a" x="0" y="0" width="1" height="1" fill="url(#df-ribbon-a1)" /><rect data-seg="b" x="0" y="0" width="1" height="1" fill="url(#df-ribbon-b1)" /></svg></span>{{ stDashMiddle }}<span class="Cell"><svg viewBox="0 0 100 200" aria-hidden="true" focusable="false"><defs><linearGradient id="df-ribbon-a2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" data-stop="0" /><stop offset=".5" data-stop="1" /><stop offset="1" data-stop="2" /></linearGradient><linearGradient id="df-ribbon-b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" data-stop="2" /><stop offset=".5" data-stop="3" /><stop offset="1" data-stop="4" /></linearGradient></defs><rect data-seg="a" x="0" y="0" width="1" height="1" fill="url(#df-ribbon-a2)" /><rect data-seg="b" x="0" y="0" width="1" height="1" fill="url(#df-ribbon-b2)" /></svg></span></p>
    <!-- 兩段文案包一層：它們要**整塊**與第一顆破折號垂直居中，而「整塊」得先
         是一個盒（dash-fuse.css § .TwoEmDashes 的格線：破折號那一列 ＋
         `align-self: center`，高度交給引擎算）。 -->
    <!-- 外層提供捲動時間長度，內層是唯一必要的 sticky 裁切面；兩個必要盒只用
         `.TwoEmDashes` namespace 下的短 class，標本次序則直接由內容清單表達。 -->
    <div class="Specimens" role="presentation" aria-hidden="true">
      <div class="Viewport" role="presentation">
        <ul>
          <li data-specimen="interpunct" data-kind="punctuation">・</li>
          <li data-specimen="ideographic-comma-pair" data-kind="conventions" data-span="2">
            <span data-convention="moe">、</span>
            <span data-convention="klr">、</span>

            <span data-convention="klr">，</span>
          </li>

            <span data-convention="moe">。</span>
            <span data-convention="klr">。</span>
          </li>
          <li data-specimen="dash" data-kind="punctuation" data-span="2">——</li>
          <li data-specimen="ellipsis" data-kind="punctuation" data-span="2">……</li>
          <li data-specimen="bone" data-kind="glyph">骨</li>

          <li data-specimen="beauty" data-kind="glyph">美</li>

          <li data-specimen="hall" data-kind="glyph">館</li>
          <li data-specimen="nurture" data-kind="glyph">育</li>
        </ul>
      </div>
    </div>
    <div class="NoteStage" role="presentation">
      <aside class="Note">
        <p>{{ stTwoEmDashesP }}</p>
        <p>{{ stPunctP }}</p>
      </aside>
    </div>

    <!-- 四語標點樣張**搬進這一格**（2026-08-28）：它 `position: sticky` 釘在畫面
         上，讀者往下捲時左邊那根柱一路走到第二顆破折號，而樣張留在原地——一句話的

    <!-- per-language punctuation demo — the SAME 三體 line (富察・福慶's stammer,

    <figure class="PunctLang Rail">

        <li lang="zh-Hant">
