<!-- Station IV・Prose — the prose module's living specimen. The copy
     sits in a real <article> (prose.css auto-scopes there), so the
     justification, the 2em indent grid and the heading-gap collapse
     apply to THIS very text — flipping the rail's prose module switch
     visibly reflows the station. 本頁即範文的直接版。 -->
<section id="station-prose" class="Station" data-station="prose" data-ground="b" data-wm="段">
  <hgroup>
    <p>{{ prEyebrow }}</p>
    <h2>{{ prH2 }}</h2>
  </hgroup>

  <div class="Annotated">
    <article class="Prose">
      <p>{{ prP1 }}</p>
      <p>{{ prP2 }}</p>
      <blockquote>
        <p>{{ prQuote }}</p>
      </blockquote>
    </article>

    <aside class="Marginalia">
      <code>--han-prose</code>
      <code>--han-prose-indent</code>
      <p>{{ prNote }}</p>
    </aside>
  </div>
</section>
