<!-- Manifesto — opening statement + the page's first live specimen. -->
<section class="Manifesto">
  <!-- Outline watermark 漢 behind the headline — decorative (aria-hidden):
       hairline stroke, transparent fill. A real span rather than a
       ::before so it can sit at its own z-index under the copy; the
       section clips it so it never forces horizontal scroll. -->
  <span class="Outline" aria-hidden="true">漢</span>

  <!-- Specimen-language chips — relocated here from the top of <main> as
       the hero's control row. Same markup/hooks as before: demo-lang.js
       keys on [data-demo-lang]; e2e on the input values. -->
  <fieldset class="DemoLangSwitch" data-demo-lang>
    <legend class="sr-only">{{ dlLegend }}</legend>
    <label><input type="radio" name="demo-lang" value="zh-Hant" checked>{{ dlHant }}</label>
    <label><input type="radio" name="demo-lang" value="zh-Hans">{{ dlHans }}</label>
    <label><input type="radio" name="demo-lang" value="ja">{{ dlJa }}</label>
    <label><input type="radio" name="demo-lang" value="ko">{{ dlKo }}</label>
  </fieldset>

  <!-- The 漢.css Brand crowns the headline — the constant wordmark (same
       atoms as the Topbar .Brand: ink 漢 · accent dot · ink css), a <span>
       rather than the masthead <a> and without the subtitle. It is the SAME
       mark in every locale; only the two tagline phrases below it localise,
       each falling on its own display line (ink, then accent). -->
  <h1>
    <span class="Brand" data-size="sm">
      <span data-part="mark">漢</span><span data-part="dot">.</span><span data-part="ext">css</span>
    </span>
    <span>{{ mfH1a }}</span>
    <span>{{ mfH1b }}</span>
  </h1>

  <p class="Lede">{{ mfLede }}</p>

  <p class="Dogfood">{{ mfDogfood }}</p>

  <span class="InstallChip">
    <code>pnpm add @hanzi.pro/han.css</code>
    <button type="button" aria-label="copy">⎘</button>
  </span>

  <!-- Vertical lede at the hero's inline-end — a serif column, shown only
       ≥68rem (hidden below, where it would collide with the copy measure). -->
  <p class="VerticalLede">{{ mfVLede }}</p>
</section>
