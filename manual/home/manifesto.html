<!-- Manifesto — opening statement + the page's first live specimen. -->
<section class="Manifesto">
  <!-- Outline watermark 漢 behind the headline — decorative (aria-hidden):
       hairline stroke, transparent fill. A real span rather than a
       ::before so it can sit at its own z-index under the copy; the
       section clips it so it never forces horizontal scroll. -->
  <span class="Outline" aria-hidden="true"></span>

  <!-- The 漢.css Brand crowns the headline — the constant wordmark (same
       atoms as the Topbar .Brand: ink 漢 · accent dot · ink css), a <span>
       rather than the masthead <a> and without the subtitle. It is the SAME
       mark in every locale; only the two tagline phrases below it localise,
       each falling on its own display line (ink, then accent). -->
  <h1>
    {{ logo }}
    {{ h1 }}
  </h1>

  <p class="dogfood">{{ dogfood }}</p>

  </label>
</section>
