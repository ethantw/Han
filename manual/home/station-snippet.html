<!-- Station IV・Snippet — the reference-code generator (data-out-*/ViewTabs). -->
<section id="station-snippet" class="Station Snippet" data-station="snippet" data-wm="碼">
  <!-- transition band — a mint strip easing from the bright page into the
       CONSTANT-dark station. Decorative (it echoes the eyebrow + a bridge
       line), so role=presentation / aria-hidden keeps it out of the a11y
       tree; the eyebrow is set vertically in CSS. -->
  <div class="Bridge" role="presentation" aria-hidden="true">
    <b data-part="lead">{{ snBridge }}</b>
    <span data-part="eyebrow">{{ snEyebrow }}</span>
  </div>

  <hgroup>
    <p>{{ snEyebrow }}</p>
    <h2>{{ snH2 }}</h2>
    <p>{{ snLede }}</p>
  </hgroup>

  <div class="Preview">
    <header>
      <!-- radio value stays `bundler` (matches codegen.js's renderBundler
           export) — only the visible label was renamed to "npm". -->
      <fieldset class="ViewTabs" data-pg-views>
        <legend class="sr-only">{{ pgViewsLegend }}</legend>
        <label><input type="radio" name="pg-view" value="bundler" checked>{{ pgOutBundler }}</label>
        <label><input type="radio" name="pg-view" value="cdn">{{ pgOutCdn }}</label>
      </fieldset>
      <select data-out-pm>
        <option value="pnpm" selected>pnpm</option>
        <option value="npm">npm</option>
        <option value="yarn">yarn</option>
      </select>
    </header>

    <!-- snippet.js renders one <figure class="CodePane"> per codegen.js
         pane here — see buildPane() there. It subscribes to <han-rail>'s
         han-config-change event (the future <han-snippet>). -->
    <div data-out-panes></div>
  </div>

  <p class="Finish">{{ snFinishLine }}</p>
  <p class="BrowserSupport">{{ snBrowserSupport }}</p>
</section>
