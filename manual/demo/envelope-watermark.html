<!doctype html>
<html lang="zh-Hant" data-locale="hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信封當浮水印——整站①預覽</title>

<!--
  站①的信封從「釘在右上角的道具」降成「詩的背景」。上一版並排五種構圖，選定了
  ④ 開封抽信；這一版只做那一個，但把**整座站①**放進來——單看一塊詩塊判斷不了
  它跟報紙帶、標記原理圖、站名擠在一起是什麼樣子。

  站①不是抄過來的，是**跑時抓的**：fetch 首頁、取出 `#station-semantics`、原樣
  植入。所以樣張永遠是站上那一份，不會有第二份要維護的複本。代價是首頁的模組
  腳本沒跟著跑，兩處要自己補：
    · `[data-station] > *` 的入場態要靠 `[data-revealed]` 解除，reveal.js 不在，
      所以自己蓋章；`html[data-han-traced]` 同理（信封的進場鍵）。
    · han.js 的後備層在 DCL 就掃過一遍，那時 main 還是空的——植入之後補叫一次
      `installFallbacks()`。
  沒補的：報紙帶的日期改寫與左右箭頭（papers-dateline.js／strip-nav.js）。那兩支
  不影響這裡要判斷的東西，日期就停在 HTML 裡的靜態值。

  旋鈕全部作用在自己那份浮水印上，站台本身一個字不改。抓進來的站①自己也帶著
  浮水印（2026-08-28 起實裝），「站上定值」就是拿它來對照——要再調一輪，滑到
  滿意再把數字抄回 home/envelope.css。

  版號釘 0.2.0-rc.0 不用 @latest：這頁在判斷易讀性，字體換一版度量就變。
  工作台，dev-only。打磨完把結論搬回 station-semantics，這頁就可以刪。
-->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/webfonts-shanggu-sans@0.2.0-rc.0/swap.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/webfonts-shanggu-serif@0.2.0-rc.0/swap.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/diantenjeom@0.2.0-rc.0/dist/diantenjeom.css">
<!-- 四支分開掛，順序照首頁：han 的模組在前、home.css 在後，串接順序就是
     層疊順序，合成一支 han.css 會把這個關係弄丟。 -->
<link rel="stylesheet" href="/han/han.semantics.css">
<link rel="stylesheet" href="/han/han.lines.css">
<link rel="stylesheet" href="/han/han.prose.css">
<link rel="stylesheet" href="/han/han.fonts.css">
<link rel="stylesheet" href="/home.css">

<script type="module">
import { installFallbacks } from '/han/han.js'

/* Pull station ① out of the live homepage. Fetching beats copying: the
   specimen has one home, and a workbench that quietly forks it stops telling
   the truth the first time the poem is edited. */
const $main = document.querySelector('main')
const html = await (await fetch('/', { cache: 'no-store' })).text()
const $station = new DOMParser().parseFromString(html, 'text/html')
  .querySelector('#station-semantics')
$main.append(document.importNode($station, true))

/* The two stamps the homepage's own modules would have made. Without them the
   station is invisible (`[data-station] > *` holds its entrance FROM state
   until reveal.js stamps) and the envelope never rises out of the fold. */
document.documentElement.dataset.hanTraced = ''
$main.querySelector('#station-semantics').dataset.revealed = ''

/* han.js installed its fallback layer at DCL, when `main` was still empty. */
installFallbacks()

/* ── the watermark ────────────────────────────────────────────────────
   It goes INSIDE the poem's <article>, not beside it: the article is the
   poem block, so an abspos child is anchored to the thing the envelope is
   supposed to be behind — no measuring, and the console's 字級 can move the
   poem without the letter drifting off it. */
const $poem = $main.querySelector('.semantic-elements article')
$poem.append(document.querySelector('#envelope').content.cloneNode(true))

/* One number CSS can't reach: the poem block's height. Everything on the
   envelope — its own height, the address type sizes — is a ratio of it, so it
   is published in px and re-published whenever the block resizes (the station
   is container-queried; the poem's 字級 changes with the plate's width). */
const $section = $main.querySelector('#station-semantics')
new ResizeObserver(([entry]) => {
  $section.style.setProperty('--poem-b', `${entry.contentRect.height}px`)
}).observe($poem)

/* A control's only job is to publish a value onto `:root`. `data-var` names
   the property and `data-unit` the suffix, so adding a knob is an HTML edit
   with no matching JS. */
const publish = ($input) => {
  const value = $input.type === 'checkbox'
    ? ($input.checked ? $input.dataset.on : $input.dataset.off)
    : $input.value + ($input.dataset.unit ?? '')
  document.documentElement.style.setProperty($input.dataset.var, value)
  const $out = $input.parentElement.querySelector('output')
  if ($out) $out.textContent = value
}
for (const $input of document.querySelectorAll('[data-var]')) {
  publish($input)
  $input.addEventListener('input', () => publish($input))
}
</script>

<style>
/* ═══ demo chrome ════════════════════════════════════════════════════
   站台的樣式全部來自 /home.css。這裡只加三樣：控件、浮水印，以及把真信封
   讓開的那一條。 */

/* 外面這層 <div> 不是裝飾：`body > header` 是首頁 Topbar 的選擇器
   （home/root.css），一個直接掛在 body 下的 <header> 會原地變成 sticky flex
   的站名列。包一層，本頁的頁首就退回一般的頁首。 */
.DemoChrome {
  position: relative;
  z-index: 3;
}

.DemoHead {
  & {
    max-inline-size: 46em;
    padding: 2rem 1.5rem 0;
    font-family: var(--han-font-alternative);
  }

  h1 { margin: 0; font-size: 1.375rem; font-weight: 600; }
  p  { margin: .5rem 0 0; color: var(--ui-supplement-text); font-size: .9375rem; line-height: 1.7; }
}

.Knobs {
  & {
    position: sticky;
    inset-block-start: 0;
    z-index: 3;
    display: flex;
    flex-wrap: wrap;
    gap: .5rem 1.5rem;
    align-items: center;
    margin: 1.5rem 1.5rem 0;
    padding: .75rem 1rem;
    background: color-mix(in srgb, var(--ui-bg) 92%, transparent);
    backdrop-filter: blur(6px);
    border: 1px solid var(--ui-rule);
    border-radius: .5rem;
    font-family: var(--font-mono);
    font-size: .8125rem;
    color: var(--ui-text);
  }

  label {
    display: flex;
    gap: .5rem;
    align-items: center;
    white-space: nowrap;
  }

  output {
    min-inline-size: 3.5em;
    color: var(--ui-accent);
  }

  input[type='range'] { inline-size: 7rem; }
}

/* ═══ the knobs' defaults ════════════════════════════════════════════
   只放**輸入**，不放算出來的顏色：帶 `var()` 的自訂屬性在宣告它的那個元素上
   就完成代換，把 `--wm-ink` 寫在 `:root` 會把 :root 的 alpha 凍進去，之後再
   覆寫 `--wm-alpha` 也改不動它（workspace ledger 的「:root 代換定型」）。
   算式一律下放到 .Wm。 */
:root {
  --wm-alpha: 7%;
  --wm-blur: 1.5px;
  --wm-scale: 1.35;                /* × 詩塊高 */
  --wm-top: 62%;                   /* 信封口在詩的第幾成高處 */
  --wm-fade: 55%;                  /* 下緣從第幾成開始淡出 */
  --wm-red-hue: var(--ui-proof);   /* 去色時換成 --ui-text */
  --wm-fine: 1;                    /* 地址小字 */
  --wm-sheet: 0;                   /* 信紙底 */
  --wm-real: none;                 /* 「現況」＝ 真信封回來、浮水印讓位 */
  --wm-shown: block;
}

/* 站上定值 vs 旋鈕。抓進來的站①自己就帶著浮水印（2026-08-28 起實裝），所以
   勾起來 ＝ 看站上那組寫死的數，放開 ＝ 看旋鈕現在的數，同一頁對照。要再調
   一輪就是這樣用：滑到滿意，把數字抄回 home/envelope.css。
   互斥的一對值由**同一個 checkbox** 推導（`:has()`，站上主題開關的同一套
   配方），而不是兩個各自發佈的變數：CSS 反相不了一個布林，兩個變數就會有
   一種「兩個都開」的狀態存在。 */
:root:has(input[name='shipped']:checked) {
  --wm-real: block;
  --wm-shown: none;
}

#station-semantics .Envelope { display: var(--wm-real); }
.Wm { display: var(--wm-shown); }

/* ═══ the envelope, as line art ══════════════════════════════════════
   浮水印住在直排的 <article> 裡，所以位置一律寫**物理**方向：邏輯屬性會照
   元素自己的書寫模式解析，在這個 vertical-rl 的盒子裡 `inset-block-start`
   是「右」不是「上」。兩種書寫模式相遇時，物理才是誠實的寫法（同
   semantics-specimen.css § 信頭標籤）。 */
.semantic-elements article { position: relative; }

.Wm {
  & {
    --wm-b: calc(var(--poem-b, 26rem) * var(--wm-scale));
    --wm-ink: color-mix(in srgb, var(--ui-text) var(--wm-alpha), transparent);
    /* 紅比墨吃虧：同 alpha 下有色相的細線看起來更淡，給它 2.5 倍。 */
    --wm-red: color-mix(
      in srgb,
      var(--wm-red-hue) min(100%, calc(var(--wm-alpha) * 2.5)),
      transparent
    );

    position: absolute;
    z-index: -1;
    top: var(--wm-top);
    left: 50%;
    transform: translateX(-50%);
    height: var(--wm-b);
    aspect-ratio: 120 / 235;   /* 長形三號 */
    color: var(--wm-ink);
    pointer-events: none;

    /* 模糊讓它退成一個「印象」而不是一張圖說。注意它和濃度是**同一個旋鈕的
       兩半**：blur 把同樣的墨攤到更大面積，看起來就更淡，所以調完 blur 通常
       要把 alpha 補回去一點。
       生產環境的信封刻意避開 `filter`（被 layerize 之後 Chromium 用區塊原本
       的裁切邊裁那一層，`overflow-clip-margin` 到不了，掀開的封口整片消失，
       實測 2026-07-28）。這裡安全，因為浮水印整個待在版心裡，沒有東西要溢出
       站台去——搬回去的時候這一條要一起帶著看。 */
    filter: blur(var(--wm-blur));

    /* 下緣淡出。信封比詩高，所以錨在詩塊上的它一定會往下伸進圖說那幾行——
       實測 1.35 倍時輪廓正好橫過 figcaption。與其縮小（那會讓信封小到認不出
       是信封），不如讓它在碰到文字之前就沒了：浮水印不需要收邊，一條硬邊反而
       會宣告「我是一個物件」。100% ＝ 幾乎不淡出，留給要看完整輪廓的時候。 */
    mask-image: linear-gradient(to bottom, #000 var(--wm-fade), transparent);
  }

  /* 封口畫在 viewBox 之外（負 y），所以不能讓 svg 自己裁掉——viewBox 就是
     信封正面，正面才是排字用的座標系。 */
  svg {
    overflow: visible;
    inline-size: 100%;
    block-size: 100%;
  }
}

/* 信紙底——「詩就是那封信」的那一半。落在詩之後、信封之前。 */
.Wm-sheet {
  position: absolute;
  z-index: -1;
  inset: -1.5rem -1.25rem;
  opacity: var(--wm-sheet);
  background: var(--ui-bg);
  box-shadow: 0 .75rem 2rem -1rem color-mix(in srgb, var(--palette-black) 18%, transparent);
}

/* 宛名／差出人。比例是生產值換算來的（envelope.css 的 rem ÷ 生產尺寸
   245×480px），但**分母一律是信封的寬**：padding 與 inset 的百分比都對包含塊
   的 inline 尺寸解析，而包含塊 .Wm 是橫排的——它的 inline 尺寸就是寬。直排的
   是這兩個盒子自己，不是它們的包含塊。 */
.Wm-addr,
.Wm-sender {
  position: absolute;
  writing-mode: vertical-rl;
  margin: 0;
  opacity: var(--wm-fine);
  text-align: start;
  word-break: keep-all;   /* 欄只在全形空白處折 */
}

.Wm-addr {
  & {
    inset: 0;
    padding-block: 9.8% 45.7%;   /* 右／左（左邊留給差出人） */
    padding-inline: 28.7% 9.1%;  /* 上（郵遞區號框之下）／下 */
    font-size: calc(var(--wm-b) * .0292);
    line-height: 2.1;
  }

  p { margin: 0; }

  /* 收件人欄——像參考信封的「山田太郎様」那樣從頭上掉下來 */
  [data-name] {
    margin-block-start: 1.2em;
    padding-inline-start: 2.2em;
    font-size: calc(var(--wm-b) * .0542);
    letter-spacing: .1em;
  }

  [data-honorific] {
    margin-inline-start: 1.1em;
    font-size: calc(var(--wm-b) * .0333);
    letter-spacing: .12em;
  }
}

/* 差出人保持斜體——han.css 只為 CJK 取消偽斜體，這裡是那條規則的另一半。 */
.Wm-sender {
  inset-block-end: 7.2%;    /* 直排下 ＝ 左 */
  inset-inline-end: 4.3%;   /* 直排下 ＝ 下 */
  font-size: calc(var(--wm-b) * .025);
  line-height: 1.6;
}
</style>
</head>
<body class="home">

<!-- 信封線稿。`<use>` 取一份定義，上色與顯隱全部走自訂屬性——CSS 選擇器進不了
     use 的影子樹，但自訂屬性繼承得進去，這也是改用 SVG 而不沿用生產那棵 DOM
     的理由（浮水印要能染色、遮罩、任意縮放）。
     座標 ＝ 長形三號 120×235mm，1 單位 ＝ 1mm；郵遞區號框的數字是生產值換算
     來的（cell 19.2×22.8px 於 245px 寬的面 ⇒ 9.4×11.2mm）。
     `vector-effect: non-scaling-stroke`：線稿當浮水印時筆畫粗細就是它的音量，
     不能讓尺寸旋鈕連帶改了它。
     地址不再包 <address>——規範上那是「本文件的聯絡資訊」，不是郵政地址；當
     背景之後它整塊是插圖，所以 aria-hidden。 -->
<template id="envelope">
  <div class="Wm-sheet" aria-hidden="true"></div>
  <div class="Wm" aria-hidden="true">
    <svg viewBox="0 0 120 235">
      <g style="fill: none; stroke: currentColor; stroke-width: 1; vector-effect: non-scaling-stroke">
        <rect x="0.5" y="0.5" width="119" height="234" />
        <path d="M 20.4 -20.6 L 99.6 -20.6 L 119.5 -0.5 L 0.5 -0.5 Z" />
        <g style="stroke: var(--wm-red)">
          <rect x="54.2" y="11" width="9.4" height="11.2" />
          <rect x="63.6" y="11" width="9.4" height="11.2" />
          <rect x="73.0" y="11" width="9.4" height="11.2" />
          <rect x="82.4" y="11" width="9.4" height="11.2" />
          <rect x="91.8" y="11" width="9.4" height="11.2" />
          <rect x="101.2" y="11" width="9.4" height="11.2" />
        </g>
      </g>
    </svg>
    <div class="Wm-addr">
      <p>大宋　淮南路　蘄州蘄水縣　直河鄉五桂墩</p>
      <p data-name>畢昇道兄<span data-honorific>台啓</span></p>
    </div>
    <p class="Wm-sender" lang="de">Johannes Gutenberg<br />Hof zum Humbrecht, Schustergasse 12<br />55116 Mainz<br />Heiliges Römisches Reich</p>
  </div>
</template>

<div class="DemoChrome">
<header class="DemoHead">
  <h1>信封當浮水印——整站①預覽</h1>
  <p>站①原樣從首頁抓來，只有信封換成了背景。詩壓在信封口上，構圖自己把首句的「來信」講完。旋鈕只動浮水印；「站上定值」勾起來換成 home/envelope.css 寫死的那一組，同一頁對照。</p>
</header>

<form class="Knobs">
  <label>
    濃度
    <input type="range" data-var="--wm-alpha" data-unit="%" min="0" max="20" step="0.5" value="7">
    <output></output>
  </label>
  <label>
    模糊
    <input type="range" data-var="--wm-blur" data-unit="px" min="0" max="8" step="0.25" value="1.5">
    <output></output>
  </label>
  <label>
    淡出
    <input type="range" data-var="--wm-fade" data-unit="%" min="20" max="100" step="1" value="55">
    <output></output>
  </label>
  <label>
    尺寸
    <input type="range" data-var="--wm-scale" min="0.7" max="2.4" step="0.05" value="1.35">
    <output></output>
  </label>
  <label>
    高低
    <input type="range" data-var="--wm-top" data-unit="%" min="20" max="95" step="1" value="62">
    <output></output>
  </label>
  <label>
    <input type="checkbox" data-var="--wm-red-hue" data-on="var(--ui-proof)" data-off="var(--ui-text)" checked>
    紅框
  </label>
  <label>
    <input type="checkbox" data-var="--wm-fine" data-on="1" data-off="0" checked>
    地址小字
  </label>
  <label>
    <input type="checkbox" data-var="--wm-sheet" data-on="1" data-off="0">
    信紙底
  </label>
  <label>
    <input type="checkbox" name="shipped">
    站上定值
  </label>
  <label>
    <input type="checkbox" name="dark-mode">
    暗色
  </label>
</form>
</div>

<main></main>

</body>
</html>
