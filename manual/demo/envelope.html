<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>直式信封 — 開封動畫</title>
<style>
/* ─── tokens ───────────────────────────────────────────────────────── */

:root {
  color-scheme: light;

  /* primitives — raw swatches, theme-invariant */
  --palette-white:     #fffdf7;
  --palette-paper:     #f6f1e4;
  --palette-paper-dim: #e7dfcc;
  --palette-mist:      #e9e4d8;
  --palette-ink:       #1c1a16;
  --palette-ink-soft:  #4c473d;
  --palette-red:       #c4352b;
  --palette-night:     #12110e;
  --palette-night-2:   #1d1b17;
  --palette-night-3:   #2b2721;

  /* semantic — components consume only these */
  --ui-bg:            light-dark(var(--palette-mist),  var(--palette-night));
  --ui-text:          light-dark(var(--palette-ink),   var(--palette-mist));
  --ui-text-2q:       color-mix(in srgb, var(--ui-text) 50%, transparent);
  --ui-envelope:      light-dark(var(--palette-white), var(--palette-night-3));
  --ui-envelope-fold: light-dark(var(--palette-paper), var(--palette-night-2));
  --ui-address:       light-dark(var(--palette-ink),      var(--palette-paper-dim));
  --ui-address-soft:  light-dark(var(--palette-ink-soft), var(--palette-mist));
  --ui-accent:        var(--palette-red);
  --ui-rule:          color-mix(in srgb, var(--ui-text) 22%, transparent);
  --ui-shadow:        light-dark(rgb(28 26 22 / .18), rgb(0 0 0 / .5));

  /* 4-layer stacks — Western / system CJK (Mac→Win) / generic */
  --font-serif:
    Georgia, 'Times New Roman',                     /* Western */
    'Hiragino Mincho ProN', 'Yu Mincho', YuMincho,  /* system 明朝 */
    serif
  ;
  --font-sans-serif:
    'Helvetica Neue', Arial,                        /* Western */
    'Hiragino Sans', 'Yu Gothic',                   /* system ゴシック */
    sans-serif
  ;

  /* geometry — 長形三號 120×235mm。信封寬（-i）是唯一自由變數，
     其餘尺寸全由它 calc 推導（直排下 cq 單位依元素書寫模式解析，不可用） */
  --size-envelope-i: min(74vw, 22rem);
  --size-envelope-b: calc(var(--size-envelope-i) * 235 / 120);
  --size-flap: calc(var(--size-envelope-b) * .09);
  --angle-flap-closed: -180deg;  /* 折平貼在背面 → 整片藏在正面之後 */
  --angle-flap-open: -18deg;     /* 立起，微微後仰 */
  --time-flap: .95s;

  /* 宛名の級数 — 全部以信封寬為基準 */
  --size-address: calc(var(--size-envelope-i) * .050);
  --size-org:     calc(var(--size-envelope-i) * .058);
  --size-rank:    calc(var(--size-envelope-i) * .046);
  --size-name:    calc(var(--size-envelope-i) * .105);
  --size-postal:  calc(var(--size-envelope-i) * .042);
  --size-sender:  calc(var(--size-envelope-i) * .036);
}

:root:has(input[name='dark-mode']:checked) { color-scheme: dark; }

/* ─── reset / base ─────────────────────────────────────────────────── */

*, *::before, *::after { box-sizing: border-box; }

:where(body, h1, p, menu, figure) { margin: 0; padding: 0; }
:where(menu) { list-style: none; }

body {
  display: grid;
  gap: 2.5rem;
  justify-items: center;
  align-content: start;
  min-block-size: 100dvb;
  padding: clamp(1.5rem, 5vw, 3.5rem) 1.25rem;
  background: var(--ui-bg);
  color: var(--ui-text);
  font-family: var(--font-sans-serif);
  line-height: 1.7;
}

/* ─── page chrome ──────────────────────────────────────────────────── */

header {
  display: grid;
  gap: 1.25rem;
  justify-items: center;
  text-align: center;

  & h1 {
    font-size: 1.5rem;
    font-weight: 400;
    letter-spacing: .08em;
  }

  & hgroup p {
    color: var(--ui-text-2q);
    font-size: .8rem;
  }
}

menu {
  display: flex;
  gap: .75rem;

  & label {
    display: inline-flex;
    gap: .4em;
    align-items: center;
    padding: .35em .9em;
    border: 1px solid var(--ui-rule);
    border-radius: 999px;
    font-size: .8rem;
    cursor: pointer;
    user-select: none;
  }
}

footer {
  color: var(--ui-text-2q);
  font-size: .75rem;
}

main { padding-block-start: var(--size-flap); }  /* 立起的蓋子的逃げ */

/* ─── envelope ─────────────────────────────────────────────────────────

   展示的是信封「正面」；蓋子長在「背面」。所以鐵律只有一條：

     蓋子永遠畫在正面之後，任何時刻都不可能跑到正面之前。

   實作不靠 z-index 數值，靠結構：蓋子在 DOM 裡排在正面「之前」，
   兩者都是 positioned（z-index 皆 auto）→ 同一繪製階段、依樹序作畫
   → 正面永遠蓋過蓋子。蓋子唯一露出的機會，是幾何上伸出本體輪廓
   之外（頂邊之上）的部分——跟實物一樣。                              */

[data-envelope] {
  position: relative;
  inline-size: var(--size-envelope-i);
  block-size: var(--size-envelope-b);
}

/* 蓋（背面的延伸）— 錨在本體頂邊之上，鉸鏈＝底邊＝信封頂邊。
   封緘＝往背面折平（-180°，整片垂在正面後方，被正面遮死）；
   開封＝立起微仰。perspective 寫在自己的 transform 裡，
   不放父層（父層一旦成 stacking context，樹序遮蔽就會被打亂）。 */
[data-flap] {
  position: absolute;
  inset-inline: 0;
  inset-block-end: 100%;
  block-size: var(--size-flap);
  transform-origin: 50% 100%;
  transform: perspective(1600px) rotateX(var(--angle-flap-closed));
  /* 參考圖的形：頂邊窄（66%）、兩肩直線斜開到折線全幅 */
  clip-path: polygon(17% 0, 83% 0, 100% 100%, 0 100%);
  /* 紙面微微受光：折線側略沉，才不會跟正面糊成一片 */
  background:
    linear-gradient(
      to top,
      var(--ui-envelope-fold),
      var(--ui-envelope) 60%
    )
  ;
  /* 輪廓：緊貼 clip-path 的 1px 線（疊兩層讓它實起來）＋一點下沉軟影。
     軟影保持小半徑、向下偏移——大暈影會溢到本體兩側外，
     看起來就像蓋子浮在正面之前（前一版的教訓） */
  filter:
    drop-shadow(0 0 1px var(--ui-rule))
    drop-shadow(0 0 1px var(--ui-rule))
    drop-shadow(0 .3rem .4rem var(--ui-shadow))
  ;
  cursor: pointer;
  transition: transform var(--time-flap) cubic-bezier(.62, .02, .3, 1);
}

/* 正面 — DOM 在後、不透明、鋪滿本體 → 樹序天然壓過蓋子 */
[data-face] {
  position: relative;  /* 與蓋子同一繪製階段（樹序才生效），不帶 z-index */
  block-size: 100%;
  background: var(--ui-envelope);
  border: 1px solid var(--ui-rule);
  box-shadow:
    0 1px 2px var(--ui-shadow),
    0 1.5rem 2.5rem -1rem var(--ui-shadow)
  ;
  font-family: var(--font-serif);
  color: var(--ui-address);
}

/* ─── 郵便番号枠 ───────────────────────────────────────────────────── */

[data-postal] {
  position: absolute;
  inset-block-start: calc(var(--size-envelope-b) * .045);
  inset-inline-end: calc(var(--size-envelope-i) * .07);
  display: flex;
  font-family: var(--font-sans-serif);
  font-size: var(--size-postal);

  & span {
    display: grid;
    place-content: center;
    inline-size: 1.7em;
    block-size: 1.35em;
    border: 1px solid var(--ui-accent);
    color: var(--ui-accent);
    line-height: 1;
  }

  /* 〒 の枠：7 桁ひと続き、境界線は重ねて 1px */
  & span + span { margin-inline-start: -1px; }
}

/* ─── 宛名（縦組み）───────────────────────────────────────────────── */

[data-recipient] {
  /* vertical-rl: block 軸＝右→左（欄），inline 軸＝上→下（欄內） */
  writing-mode: vertical-rl;
  position: absolute;
  inset: 0;
  padding-block:
    calc(var(--size-envelope-i) * .07)   /* 右端 */
    calc(var(--size-envelope-i) * .06)   /* 左端 */
  ;
  padding-inline:
    calc(var(--size-envelope-b) * .14)   /* 郵便番号枠の下から */
    calc(var(--size-envelope-b) * .05)   /* 下端 */
  ;
  font-style: normal;
  line-height: 1;

  & p {
    letter-spacing: .06em;
  }

  & [data-line='address'] {
    font-size: var(--size-address);
  }

  & [data-line='org'] {
    margin-block-start: 1.5em;
    padding-inline-start: 1.4em;
    font-size: var(--size-org);
  }

  & [data-line='dept'],
  & [data-line='title'] {
    padding-inline-start: 4em;
    font-size: var(--size-rank);
    color: var(--ui-address-soft);
  }

  & [data-line='dept']  { margin-block-start: 1.6em; }
  & [data-line='title'] { margin-block-start: 1.4em; }

  & [data-line='name'] {
    margin-block-start: 1.2em;
    padding-inline-start: 2.2em;
    font-size: var(--size-name);
    letter-spacing: .12em;
  }

  /* 「様」は姓名と同じ欄の続き、級数はほぼ揃える */
  & [data-honorific] {
    margin-inline-start: 1.2em;
    font-size: .85em;
  }
}

/* ─── 差出人（左下、縦組み小）─────────────────────────────────────── */

[data-sender] {
  writing-mode: vertical-rl;
  position: absolute;
  /* ⚠︎ logical inset 依「元素自身」書寫模式解析（同 cq 單位的陷阱）：
     vertical-rl 下 block-end＝實體左、inline-end＝實體下 */
  inset-block-end: calc(var(--size-envelope-i) * .08);    /* 左 */
  inset-inline-end: calc(var(--size-envelope-b) * .085);  /* 下 */
  font-style: normal;
  line-height: 1;
  font-size: var(--size-sender);

  & p {
    letter-spacing: .05em;
  }

  & [data-line='name'] {
    margin-block-start: 1.1em;
    font-size: 1.15em;
  }
}

[data-sender-postal] {
  position: absolute;
  inset-inline-start: calc(var(--size-envelope-i) * .08);
  inset-block-end: calc(var(--size-envelope-b) * .035);
  font-family: var(--font-sans-serif);
  font-size: calc(var(--size-envelope-i) * .034);
  letter-spacing: .06em;
  color: var(--ui-address-soft);
}

:root:has(input[name='flap']:checked) [data-flap] {
  transform: perspective(1600px) rotateX(var(--angle-flap-open));
}

@media (prefers-reduced-motion: reduce) {
  [data-flap] { transition-duration: 1ms; }
}
</style>
</head>
<body>

<header>
  <hgroup>
    <h1>直式信封</h1>
    <p>長形三號（120×235mm）・開封動畫</p>
  </hgroup>
  <menu>
    <li>
      <label>
        <input type="checkbox" name="flap" id="flap">
        開封
      </label>
    <li>
      <label>
        <input type="checkbox" name="dark-mode">
        🌒
      </label>
      <script>
        try {
          const $cb = document.querySelector('input[name="dark-mode"]')
          $cb.checked = matchMedia('(prefers-color-scheme: dark)').matches
        } catch (e) { console.error(e) }
      </script>
  </menu>
</header>

<main>
  <figure data-envelope>
    <!-- 蓋子：DOM 順序在正面「之前」→ 永遠畫在正面之下。
         封緘時整片藏在正面後方（hit-test 也輸給正面），
         所以開封由 menu 的 checkbox 觸發；立起的蓋子可點擊閉合 -->
    <label data-flap for="flap" aria-label="封緘"></label>
    <div data-face lang="ja">

      <p data-postal aria-label="郵便番号 460-0008">
        <span>4</span><span>6</span><span>0</span><span>0</span><span>0</span><span>0</span><span>8</span>
      </p>

      <address data-recipient>
        <p data-line="address">愛知県名古屋市中区栄三丁目二四番一号</p>
        <p data-line="org">桜井紙工株式会社</p>
        <p data-line="dept">総務部</p>
        <p data-line="title">部長</p>
        <p data-line="name">高橋　一郎<span data-honorific>様</span></p>
      </address>

      <address data-sender>
        <p data-line="address">三重県津市羽所町五一六番地</p>
        <p data-line="name">東海商事株式会社　佐藤　花子</p>
      </address>
      <p data-sender-postal>〒514-0009</p>

    </div>
  </figure>
</main>

<footer>
  <p>Han.css v4・<a href="/demo/">回示例首頁</a></p>
</footer>

</body>
</html>
