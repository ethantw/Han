<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>讀音站——外行星採礦公報</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/webfonts-shanggu-sans@%VITE_ZIANO_VERSION%/swap.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/webfonts-shanggu-serif@%VITE_ZIANO_VERSION%/swap.css">
<link rel="stylesheet" href="/han/han.css">
<link rel="stylesheet" href="/common/variables.css">
<link rel="stylesheet" href="/common/icons.css">
<link rel="stylesheet" href="/demo/ruby-readings.css">
<script type="module" src="/demo/ruby-readings.js"></script>
</head>
<body>
<main>
  <section id="station-readings" data-station="readings" data-reading-mode="minnan" data-writing="horizontal">
    <hgroup>
      <p>伍・標音</p>
      <h1>一字，三層注文</h1>
    </hgroup>
    <p class="StationLede">一個字，可以同時承載本字、在地讀音與羅馬字轉寫。這一站以閩南語方音／臺羅、國語注音／拼音及日韓注文，展示複層 ruby 如何循詞界落位，並在橫排與直排之間保持秩序。</p>

    <svg class="BarnardMap StationSky" viewBox="0 0 1440 620" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <radialGradient id="barnard-glow">
          <stop offset="0" stop-color="var(--barnard-core)" stop-opacity=".52" />
          <stop offset=".2" stop-color="var(--barnard-core)" stop-opacity=".2" />
          <stop offset="1" stop-color="var(--barnard-core)" stop-opacity="0" />
        </radialGradient>
        <marker id="barnard-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
        </marker>
      </defs>
      <g class="BarnardGrid">
        <path d="M90 94H1360M60 256H1390M110 470H1340" />
        <path d="M240 24V590M720 10V610M1160 30V584" />
      </g>
      <g class="BarnardOrbit">
        <ellipse cx="930" cy="215" rx="310" ry="128" />
        <ellipse cx="930" cy="215" rx="188" ry="77" />
        <circle cx="930" cy="215" r="92" fill="url(#barnard-glow)" />
        <circle class="BarnardCore" cx="930" cy="215" r="18" />
        <path d="M1330 70C1170 88 1065 133 930 215S650 395 378 530" marker-end="url(#barnard-arrow)" />
        <path d="M900 215h60M930 185v60" />
      </g>
      <g class="BarnardStars">
        <circle cx="170" cy="150" r="2" /><circle cx="350" cy="82" r="3" />
        <circle cx="525" cy="320" r="2" /><circle cx="1180" cy="385" r="2.5" />
        <circle cx="1290" cy="525" r="2" /><circle cx="780" cy="525" r="1.5" />
      </g>
    </svg>

    <form class="ReadingSwitch" aria-label="切換捷報語言與排版方向">
      <fieldset class="ViewTabs LayoutTabs" aria-labelledby="reading-direction-label">
        <span class="PillHead" id="reading-direction-label">行向</span>
        <label><input type="radio" name="writing-mode" value="horizontal" checked> 橫排</label>
        <label><input type="radio" name="writing-mode" value="vertical"> 直排</label>
      </fieldset>
      <fieldset class="ViewTabs" aria-labelledby="reading-language-label">
        <span class="PillHead" id="reading-language-label">注文</span>
        <label><input type="radio" name="reading-mode" value="minnan" checked> 閩南語</label>
        <label><input type="radio" name="reading-mode" value="mandarin"> 國語</label>
        <label><input type="radio" name="reading-mode" value="japanese"> 日文</label>
        <label><input type="radio" name="reading-mode" value="korean"> 韓文</label>
      </fieldset>
    </form>

    <nav class="RailNav StationRailNav" data-strip-nav="readings" aria-label="移動讀音樣張">
      <span class="RailButtons">
        <button type="button" data-scroll="prev" aria-label="向前移動讀音樣張"><span data-icon="chevron" aria-hidden="true"></span></button>
        <button type="button" data-scroll="next" aria-label="向後移動讀音樣張"><span data-icon="chevron" aria-hidden="true"></span></button>
      </span>
    </nav>

    <div class="StationColumns" data-strip="readings" tabindex="0" aria-label="可橫向捲動的數字公報與元素材料清單">
      <article class="NumberStory" aria-labelledby="story-title">
        <header class="ColumnHead">
          <div>
            <h2 id="story-title">
              <ruby class="PhoneticLabel" data-zhuyin="ㄑㄧㄡˊ ㄐㄧˋ">球際</ruby><ruby class="PhoneticLabel" data-zhuyin="ㄘㄞˇ ㄎㄨㄤˋ">採礦</ruby><ruby class="PhoneticLabel" data-zhuyin="ㄐㄩㄣ ㄊㄨㄢˊ">軍團</ruby><br>
              <ruby class="PhoneticLabel" data-zhuyin="ㄒㄧˇ ㄇㄚˇ ㄌㄚ ㄧㄚˇ">喜馬拉雅</ruby><ruby class="PhoneticLabel" data-zhuyin="ㄧ ㄌㄧㄡˋ ㄅㄚ ㄑㄧ">一六八七</ruby><ruby class="PhoneticLabel" data-zhuyin="ㄕ">師</ruby><ruby class="PhoneticLabel" data-zhuyin="ㄉㄧˋ">第</ruby><ruby class="PhoneticLabel" data-zhuyin="ㄕˊ">十</ruby><ruby class="PhoneticLabel" data-zhuyin="ㄐㄧㄢˋ ㄓ">艦隻</ruby>
            </h2>
          </div>
          <button class="SpeakAll" type="button" data-speak-group="numbers" data-lang="nan-TW" data-speech="一、六、七、八、十">
            <span data-icon="volume" aria-hidden="true"></span>
            <span class="SpeakLabel" data-speak-group-label>讀全篇捷報</span>
          </button>
        </header>

        <div class="Dispatch Numbers" lang="nan-Hant-TW" aria-label="以五個入聲數字寫成的球際採礦捷報">
          <p class="DispatchCopy" data-dispatch-copy></p>
          <p class="DispatchPromise">這批材料會予地球佮太陽系有機會共電磁囚籠、超導磁喉、熱盾佮偵測器，對圖紙搬入深空船塢。</p>
          <small>十垓噸約是一個地球質量的六分之一；球際公報的會計部門拒絕對這个數字負責。</small>
        </div>
      </article>

      <figure class="ElementAtlas" aria-labelledby="elements-title">
        <header class="ColumnHead">
          <div>
            <h2 id="elements-title"><ruby class="PhoneticLabel" data-zhuyin="ㄅㄚ ㄋㄚˋ ㄉㄜˊ">巴納德</ruby><ruby class="PhoneticLabel" data-zhuyin="ㄖㄣˋ ㄨˋ">任務</ruby><ruby class="PhoneticLabel" data-zhuyin="ㄩㄢˊ ㄙㄨˋ">元素</ruby><ruby class="PhoneticLabel" data-zhuyin="ㄅㄧㄠˇ">表</ruby></h2>
          </div>
          <button class="SpeakAll" type="button" data-speak-group="elements" data-lang="zh-TW" data-speech="氦、鈹、硼、鈧、釩、銣、鋯、鈮、鉬、釕、銦、銻、銫、鉿、鎢、錸、鋨、銥、鐠、釹、釓、鏑、鐿、鎦">
            <span data-icon="volume" aria-hidden="true"></span>
            <span class="SpeakLabel">全部元素讀音</span>
          </button>
        </header>

        <div class="ElementMeta">
          <ul class="ElementLegend" aria-label="元素分類色">
            <li data-category="alkali"><ruby class="PhoneticLabel" data-zhuyin="ㄐㄧㄢˇ ㄐㄧㄣ">鹼金</ruby></li>
            <li data-category="alkaline"><ruby class="PhoneticLabel" data-zhuyin="ㄐㄧㄢˇ ㄊㄨˇ">鹼土</ruby></li>
            <li data-category="transition"><ruby class="PhoneticLabel" data-zhuyin="ㄍㄨㄛˋ ㄉㄨˋ">過渡</ruby></li>
            <li data-category="post-transition"><ruby class="PhoneticLabel" data-zhuyin="ㄆㄧㄣˊ ㄐㄧㄣ">貧金</ruby></li>
            <li data-category="metalloid"><ruby class="PhoneticLabel" data-zhuyin="ㄌㄟˋ ㄐㄧㄣ">類金</ruby></li>
            <li data-category="lanthanide"><ruby class="PhoneticLabel" data-zhuyin="ㄌㄢˊ ㄒㄧˋ">鑭系</ruby></li>
            <li data-category="noble"><ruby class="PhoneticLabel" data-zhuyin="ㄉㄨㄛˋ ㄒㄧㄥˋ">惰性</ruby></li>
          </ul>
        </div>

        <div class="MaterialViewport">
          <div class="MaterialField">
            <ol class="MaterialGrid" data-material-grid aria-label="二十四種反物質引擎候選材料"></ol>
          </div>
        </div>

      </figure>
    </div>

    <footer class="StationFoot">
      <p class="SpeechStatus"><span class="StatusLight" aria-hidden="true"></span><output data-speech-status role="status" aria-live="polite">正在尋找本機語音……</output></p>
      <p>聲音由本機 <code>SpeechSynthesis</code> 提供；閩南語語音是否可用取決於瀏覽器與作業系統。</p>
    </footer>
  </section>
</main>
</body>
</html>
