<style>
:root{--paper:#faf9f7;--ink:#0e0e10;--green:#0a8754;--rule:#e5e2db;--sup:#6b6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;padding:48px 56px}
h1{font-weight:600;font-size:20px;margin:0 0 4px}
.sub{color:var(--sup);margin:0 0 40px;font-size:14px}
.row{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:24px;padding:28px 0;border-top:1px solid var(--rule)}
.row.dk{background:var(--ink);border-radius:12px;padding:28px 24px;border:0;margin-top:8px}
.row.dk .lbl{color:#aaa}.row.dk .lk{color:#fff}
.lbl{color:var(--sup);font-size:13px;margin:0;line-height:1.5}
.lk{display:flex;align-items:center;gap:48px;flex-wrap:wrap}
/* G3 字徽 */
.g3{height:1.15em;width:1.15em;display:inline-block;vertical-align:-0.22em}
/* 傳承字標 */
.wm{display:inline-flex;align-items:baseline;font-weight:600}
.hm{position:relative;color:transparent}
.hm .BrandGlyph{position:absolute;inset-inline-start:0;bottom:0;height:1em;width:1em;fill:var(--ink)}
.dk .hm .BrandGlyph{fill:#fff}
.dot{color:var(--green);padding:0 .06em}
.ext{font-weight:400;font-family:'Helvetica Neue',Arial}
.dk .ext{color:#fff}
/* 尺寸 */
.mh{font-size:30px}   /* masthead 尺度 */
.hero{font-size:64px} /* hero 尺度 */
/* lockup 排法 */
.lock{display:inline-flex;align-items:center;gap:.5em}
.stack{display:inline-flex;flex-direction:column;align-items:center;gap:.25em}
.stack .g3{height:1.4em;width:1.4em}
</style>
