name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests + coverage (≥80% lines / branches / functions)
        run: pnpm test:coverage

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E tests (Chromium)
        run: pnpm test:e2e
        env:
          CI: 'true'

      # 首頁的字體子集只裝這一頁排得出來的字。字表落後於頁面時，多出來的字會
      # 安靜地掉到系統字——畫面不會壞，只是傳承字形裡混進一個蘋方。安靜的失敗
      # 要用閘門擋。這一關只驗「字表跟得上頁面」；另一半「字體蓋得住字表」由
      # ziano 建置時的 --require-full-coverage 保證，所以這裡不必有字體檔，也
      # 不必有 ziano。
      - name: Home font-subset charset is up to date
        run: |
          pnpm --filter han-home exec vite --port 7770 --strictPort &
          for i in $(seq 60); do
            curl -sf -o /dev/null http://localhost:7770/ && break
            sleep 1
          done
          node home/scripts/collect-chars.mjs --check

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
