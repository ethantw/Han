name: Release Please

# Watches `main` for conventional-commit-style messages and opens a
# rolling "Release PR" that bumps `package.json` + updates
# `CHANGELOG.md`. Merging that PR creates a tagged GitHub release.
#
# This workflow is INFRASTRUCTURE-ONLY as of 2026-05-02 — it does NOT
# publish to npm. To enable publishing later, uncomment the publish
# steps below and add `NPM_TOKEN` to repo secrets.
#
# Fires on `master` (this repo's default branch — there is no `main`).
# Until the v4 line lands on master this never triggers, which matches
# the RC decision: 4.0.0-rc.1 publishes MANUALLY (`npm publish --tag rc`);
# automation takes over from the first stable release.

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # ── npm publish step (currently disabled) ────────────────────
      # When ready to ship, set `if:` to `${{ steps.release.outputs.release_created }}`
      # on each step below and add `NPM_TOKEN` to the repo's Actions
      # secrets. Uncomment the block.
